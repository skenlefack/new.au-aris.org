# ═══════════════════════════════════════════════════════════════
# ARIS 4.0 — VM-CACHE-STG: Redis 7 + OpenSearch 2.17.1
# Staging Environment
# ═══════════════════════════════════════════════════════════════

services:

  redis:
    image: redis:7-alpine
    container_name: aris-stg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-R3d1s_Stg_2024!vN7wQ}
      --tcp-backlog 65535
      --timeout 300
      --tcp-keepalive 60
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - /var/lib/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-R3d1s_Stg_2024!vN7wQ}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aris-cache-stg-network
    deploy:
      resources:
        limits:
          memory: 1G

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: aris-stg-opensearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-0pnSrch_Stg_2024!bT4kL}
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.name=aris-search-staging
      - node.name=opensearch-stg-node-1
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - /var/lib/opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - aris-cache-stg-network
    deploy:
      resources:
        limits:
          memory: 2G

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: aris-stg-opensearch-dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - aris-cache-stg-network

  # ═══════════════════════════════════════════════════
  #  PORTAINER AGENT — Remote container management
  # ═══════════════════════════════════════════════════
  portainer-agent:
    image: portainer/agent:2.21.5
    container_name: aris-stg-portainer-agent
    restart: unless-stopped
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - aris-cache-stg-network

networks:
  aris-cache-stg-network:
    driver: bridge
    name: aris-cache-stg-network
