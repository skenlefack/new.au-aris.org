<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#f5f5f5}
#map{width:100%;height:100%}
.legend{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.92);border-radius:8px;padding:6px 12px;
  font:600 10px/1.4 -apple-system,Roboto,sans-serif;color:#444;
  display:flex;gap:10px;z-index:1000;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;
  box-shadow:0 0 3px rgba(0,0,0,.2)}
.info-popup b{font-size:13px;color:#1B5E20}
.info-popup .cases{font-size:18px;font-weight:700;color:#333;margin:4px 0}
.info-popup .severity{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;display:inline-block}
</style>
</head>
<body>
<div id="map"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#E53935"></div>Critical</div>
  <div class="legend-item"><div class="legend-dot" style="background:#FF9800"></div>High</div>
  <div class="legend-item"><div class="legend-dot" style="background:#FFC107"></div>Medium</div>
  <div class="legend-item"><div class="legend-dot" style="background:#4CAF50"></div>Low</div>
  <div class="legend-item"><div class="legend-dot" style="background:#009688"></div>Watch</div>
</div>

<script>
var map = L.map('map',{
  center:[4,20],
  zoom:3,
  minZoom:2,
  maxZoom:6,
  zoomControl:false,
  attributionControl:false,
  maxBounds:[[-38,-30],[42,58]],
  maxBoundsViscosity:1.0
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  subdomains:'abcd',
  maxZoom:6
}).addTo(map);

var countries=[
  {name:"Egypt",       lat:26.8,  lng:30.8,  cases:3456, color:"#E53935", sev:"Critical"},
  {name:"Kenya",       lat:-1.3,  lng:36.8,  cases:2800, color:"#E53935", sev:"Critical"},
  {name:"South Africa",lat:-30.6, lng:22.9,  cases:2100, color:"#FF9800", sev:"High"},
  {name:"Ethiopia",    lat:9.1,   lng:40.5,  cases:1560, color:"#FF9800", sev:"High"},
  {name:"DR Congo",    lat:-4.0,  lng:21.8,  cases:1234, color:"#FFC107", sev:"Medium"},
  {name:"Nigeria",     lat:9.1,   lng:8.7,   cases:1100, color:"#FFC107", sev:"Medium"},
  {name:"Sudan",       lat:15.5,  lng:32.5,  cases:980,  color:"#4CAF50", sev:"Low"},
  {name:"Uganda",      lat:1.4,   lng:32.3,  cases:920,  color:"#4CAF50", sev:"Low"},
  {name:"Tanzania",    lat:-6.4,  lng:34.9,  cases:890,  color:"#009688", sev:"Watch"},
  {name:"Somalia",     lat:5.2,   lng:46.2,  cases:670,  color:"#009688", sev:"Watch"},
  {name:"Chad",        lat:15.5,  lng:18.7,  cases:560,  color:"#009688", sev:"Watch"},
  {name:"Morocco",     lat:31.8,  lng:-7.1,  cases:420,  color:"#009688", sev:"Watch"},
  {name:"Algeria",     lat:28.0,  lng:1.7,   cases:380,  color:"#009688", sev:"Watch"},
  {name:"Cameroon",    lat:7.4,   lng:12.4,  cases:510,  color:"#009688", sev:"Watch"},
  {name:"Mozambique",  lat:-18.7, lng:35.5,  cases:340,  color:"#009688", sev:"Watch"},
  {name:"Senegal",     lat:14.5,  lng:-14.5, cases:290,  color:"#009688", sev:"Watch"},
  {name:"Mali",        lat:17.6,  lng:-4.0,  cases:310,  color:"#009688", sev:"Watch"},
  {name:"Angola",      lat:-11.2, lng:17.9,  cases:250,  color:"#009688", sev:"Watch"}
];

var maxCases=3456;
countries.forEach(function(c){
  var r=Math.max(Math.sqrt(c.cases/maxCases)*18,5);
  var m=L.circleMarker([c.lat,c.lng],{
    radius:r,
    fillColor:c.color,
    color:'#fff',
    weight:2,
    opacity:1,
    fillOpacity:0.8
  }).addTo(map);

  m.bindPopup(
    '<div class="info-popup">'+
    '<b>'+c.name+'</b>'+
    '<div class="cases">'+c.cases.toLocaleString()+' cases</div>'+
    '<span class="severity" style="background:'+c.color+'">'+c.sev+'</span>'+
    '</div>',
    {closeButton:false,offset:[0,-5]}
  );

  m.bindTooltip(c.name,{
    permanent:true,
    direction:'right',
    offset:[r+2,0],
    className:'country-label'
  });
});

// Style permanent tooltips
var style=document.createElement('style');
style.textContent='.country-label{background:transparent!important;border:none!important;'+
  'box-shadow:none!important;font:600 9px -apple-system,Roboto,sans-serif;color:#333;'+
  'padding:0!important;white-space:nowrap}'+
  '.country-label::before{display:none}';
document.head.appendChild(style);
</script>
</body>
</html>
