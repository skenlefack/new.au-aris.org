<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100vh;overflow:hidden;background:#f0f4f8}
#map{position:absolute;top:0;left:0;right:0;bottom:0}
#err{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font:bold 14px sans-serif;color:#c00;text-align:center;z-index:9999;
  background:#fff;padding:12px 20px;border-radius:8px;display:none}
.leaflet-popup-content{font-family:-apple-system,Roboto,sans-serif;font-size:13px;min-width:150px}
.leaflet-popup-content b{font-size:14px;display:block;margin-bottom:3px}
.leaflet-popup-content .cases{font-size:16px;font-weight:700;color:#333;margin:3px 0}
.leaflet-popup-content .badge{display:inline-block;padding:2px 8px;border-radius:12px;
  font-size:11px;font-weight:500;color:#fff}
</style>
</head>
<body>
<div id="map"></div>
<div id="err"></div>
<script src="leaflet.js"></script>
<script>
try {
  if (typeof L === 'undefined') {
    document.getElementById('err').style.display='block';
    document.getElementById('err').textContent='Leaflet failed to load';
    throw new Error('Leaflet not loaded');
  }

  var map = L.map('map',{
    center:[2,20],
    zoom:3,
    minZoom:2,
    maxZoom:7,
    zoomControl:true,
    attributionControl:true,
    maxBounds:[[-40,-25],[42,58]],
    maxBoundsViscosity:1.0
  });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
    maxZoom:7
  }).addTo(map);

  map.fitBounds([[-35,-18],[37,52]]);

  var markers=[
    {name:"Egypt",       lat:26.8,  lng:30.8,  cases:3456, sev:"critical", color:"#C62828"},
    {name:"Kenya",       lat:-1.3,  lng:36.8,  cases:2800, sev:"critical", color:"#C62828"},
    {name:"South Africa",lat:-30.6, lng:22.9,  cases:2100, sev:"high",     color:"#E65100"},
    {name:"Ethiopia",    lat:9.1,   lng:40.5,  cases:1560, sev:"high",     color:"#E65100"},
    {name:"DR Congo",    lat:-4.0,  lng:21.8,  cases:1234, sev:"medium",   color:"#F57F17"},
    {name:"Nigeria",     lat:9.1,   lng:8.7,   cases:1100, sev:"medium",   color:"#F57F17"},
    {name:"Sudan",       lat:15.5,  lng:32.5,  cases:980,  sev:"low",      color:"#2E7D32"},
    {name:"Uganda",      lat:1.4,   lng:32.3,  cases:920,  sev:"low",      color:"#2E7D32"},
    {name:"Tanzania",    lat:-6.4,  lng:34.9,  cases:890,  sev:"low",      color:"#2E7D32"},
    {name:"Somalia",     lat:5.2,   lng:46.2,  cases:670,  sev:"low",      color:"#2E7D32"},
    {name:"Chad",        lat:15.5,  lng:18.7,  cases:560,  sev:"low",      color:"#2E7D32"},
    {name:"Morocco",     lat:31.8,  lng:-7.1,  cases:420,  sev:"low",      color:"#2E7D32"},
    {name:"Algeria",     lat:28.0,  lng:1.7,   cases:380,  sev:"low",      color:"#2E7D32"},
    {name:"Cameroon",    lat:7.4,   lng:12.4,  cases:510,  sev:"low",      color:"#2E7D32"},
    {name:"Mozambique",  lat:-18.7, lng:35.5,  cases:340,  sev:"low",      color:"#2E7D32"},
    {name:"Senegal",     lat:14.5,  lng:-14.5, cases:290,  sev:"low",      color:"#2E7D32"},
    {name:"Mali",        lat:17.6,  lng:-4.0,  cases:310,  sev:"low",      color:"#2E7D32"},
    {name:"Angola",      lat:-11.2, lng:17.9,  cases:250,  sev:"low",      color:"#2E7D32"}
  ];

  markers.forEach(function(m){
    var icon = L.divIcon({
      html:'<div style="background:'+m.color+';width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)"></div>',
      className:'',
      iconSize:[12,12],
      iconAnchor:[6,6]
    });

    L.marker([m.lat,m.lng],{icon:icon}).addTo(map)
      .bindPopup(
        '<b>'+m.name+'</b>'+
        '<div class="cases">'+m.cases.toLocaleString()+' cases</div>'+
        '<span class="badge" style="background:'+m.color+'">'+m.sev+'</span>'
      );
  });

  // Force invalidate size after layout completes (WebView starts at 0x0 in Compose)
  function resizeMap() {
    var el = document.getElementById('map');
    if (el.clientHeight === 0) {
      el.style.height = window.innerHeight + 'px';
    }
    map.invalidateSize();
    map.fitBounds([[-35,-18],[37,52]]);
  }
  setTimeout(resizeMap, 200);
  setTimeout(resizeMap, 600);
  setTimeout(resizeMap, 1500);
  window.addEventListener('resize', function(){ map.invalidateSize(); });

} catch(e) {
  document.getElementById('err').style.display='block';
  document.getElementById('err').textContent='Error: ' + e.message;
}
</script>
</body>
</html>
