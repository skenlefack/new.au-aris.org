openapi: 3.1.0
info:
  title: ARIS — Interoperability API
  version: 1.0.0
  summary: Exchange animal-resources data with the African Union ARIS platform.
  contact:
    name: AU-IBAR ARIS team
    url: https://au-aris.org
  license:
    name: Proprietary — AU-IBAR. Use subject to a data exchange agreement.
    url: https://au-aris.org
  description: |
    ## Overview

    **ARIS** (Animal Resources Information System) is the continental digital
    infrastructure of the African Union Inter-African Bureau for Animal Resources
    (AU-IBAR). It covers the eight ARIS domains: Animal Health, Livestock production,
    Economy & Trade, Fisheries & Aquaculture, Governance, Wildlife, Apiculture and
    Knowledge management, for the 55 AU Member States and 8 Regional Economic
    Communities (RECs).

    The **Interoperability Hub** is the single entry and exit point for system-to-system
    exchange. National information systems (e.g. DHIS2, KLHIS, national LIMS), regional
    and international partners (AU-DOHP, WOAH, FAO) connect to ARIS through *connections*;
    every exchange runs through a configurable *pipeline* and is tracked as a *transaction*.

    Data is produced and validated at country level (federated subsidiarity); ARIS
    consolidates it at REC and continental level ("report once, use many").

    ## Environments

    | Environment | Base URL | Purpose |
    |---|---|---|
    | Production | `https://au-aris.org` | Live, official data. |
    | Staging / sandbox | `https://test.au-aris.org` | **Partner sandbox — use for all integration tests.** Separate database, accounts and keys. |

    **Staging (`https://test.au-aris.org`) is the sandbox where partner credentials
    are issued first.** Each new partner receives a service account and connection
    credentials (API key / token, webhook secret) on Staging, completes integration
    tests there, and only then receives separate Production credentials. Credentials
    are environment-specific and are issued by the ARIS team (or your national ARIS
    administrator) when your connection is configured.

    ## Authentication

    Three mechanisms are used, depending on the endpoint:

    1. **User JWT (`bearerAuth`)** — obtained from `POST /api/v1/credential/auth/login`.
       RS256-signed, valid **15 minutes** (`expiresIn: 900`), renewed with
       `POST /api/v1/credential/auth/refresh`. Required for all management, monitoring,
       file upload, reference-data and direct-export endpoints. Access is limited to
       the caller's own tenant and further restricted by role (see each operation).
    2. **Connection API key (`apiKeyAuth`) or connection token (`connectionToken`)** —
       a static secret attached to one **inbound connection**, sent as `X-API-Key: <key>`
       or `Authorization: Bearer <token>`. Accepted **only** by
       `POST /api/v1/hub/ingest/push` and `GET /api/v1/hub/ingest/transactions/{id}`.
       A user JWT is *not* accepted there.
    3. **Webhook signature (`webhookSignature`)** — `X-Webhook-Signature` = HMAC-SHA256 of
       the raw request body with the connection's webhook secret. Used only by
       `POST /api/v1/hub/ingest/webhook/{connectionId}`.

    > **Sessions.** The platform keeps a single active session per account and device
    > class (one "web" and one "mobile" session). Logging in again with the same account
    > from another script, server or browser revokes the previous session's refresh
    > token. **Request a dedicated service account for each partner system** and never
    > share it with human users. Login is rate limited (10 requests/minute per IP) and
    > MFA (TOTP) may be enforced on the account.

    ## Integration models

    | Model | Endpoint | Auth | Notes |
    |---|---|---|---|
    | **API push** | `POST /api/v1/hub/ingest/push` | API key / connection token | JSON records, up to 10,000 per call and 50 MiB per request body. Asynchronous (`202`); poll the result with `GET /api/v1/hub/ingest/transactions/{id}` using the same credential. |
    | **File upload** | `POST /api/v1/hub/ingest/upload` | User JWT (hub manager role) | `.csv` (`,` or `;` auto-detected), `.tsv`, `.json`; max 100 MB. Asynchronous (`202`). |
    | **Signed webhook** | `POST /api/v1/hub/ingest/webhook/{connectionId}` | HMAC signature | Event-driven delivery from your system. Asynchronous (`202`). |
    | **Manual / triggered run** | `POST /api/v1/hub/pipelines/{id}/execute` | User JWT (hub manager role) | Runs a pipeline synchronously on supplied records. |
    | **Scheduled pull** | `/api/v1/hub/schedules` | User JWT | Schedules can be configured, but automatic retrieval of data from partner APIs is **not yet operational** — see *Schedules*. |
    | **Standard connectors (outbound)** | WAHIS, EMPRES, FAOSTAT, FishStatJ, CITES, DHIS2, FHIR | — | Outbound pipelines are triggered by ARIS validation events and either deliver to the partner endpoint or store the built package on the transaction (`target_payload`). Legacy direct exports are described under *Direct exports*. |

    ## Processing pipeline

    Every inbound or outbound exchange runs the enabled steps of a pipeline, in
    `step_order`:

    | Step | What it does |
    |---|---|
    | `RECEIVE` | Accepts the records; can extract an array at `config.records_path` and enforce `config.max_batch_size`. |
    | `REFERENTIAL_MAP` | Replaces partner codes with ARIS codes using the connection's referential mappings (disease, species, admin units, units, …). |
    | `FIELD_TRANSFORM` | Renames/transforms fields using the connection's field mappings or an inline JSONata expression. **Only mapped fields are kept.** |
    | `SCHEMA_VALIDATE` | Validates each record against a JSON Schema (`strict` rejects, otherwise warns). |
    | `QUALITY_GATE` | Calls the ARIS data-quality service (completeness, temporal/geographic consistency, codes, units, duplicates, auditability). Blocks only if the pipeline has `reject_on_quality_fail`. |
    | `ENRICH` | Adds names/IDs from ARIS master data for `*_code` fields (best effort). |
    | `FORMAT_BUILD` | Builds the target package (WOAH XML/JSON, EMPRES JSON, FAOSTAT CSV, …). |
    | `NOTIFY` | Notifies the interoperability managers. In `MANUAL` mode the transaction **stops here** in `AWAITING_REVIEW`. |
    | `ROUTE` | Inbound: loads **one ARIS data-collection submission per record** (up to 5 in parallel) into the pipeline's target campaign, then into the normal 4-level validation workflow. |
    | `DELIVER` | Outbound: sends the package to the partner endpoint (with retries on 5xx), or keeps it on the transaction for download when no URL is configured. |

    ## Transaction lifecycle

    ```
    QUEUED → RECEIVED → MAPPING → TRANSFORMING → VALIDATING
           → AWAITING_REVIEW (MANUAL mode) → APPROVED | REJECTED
           → LOADING → COMPLETED | PARTIAL | FAILED
    FAILED / PARTIAL → RETRY (manual retry) → …      any non-terminal → CANCELLED
    ```

    * `COMPLETED` — all records accepted. `PARTIAL` — some records rejected
      (see `records` / `error_message`). `FAILED` — a step failed with `on_error=STOP`,
      or every record was rejected.
    * Ingest endpoints return `202 Accepted` with a `transaction_id` as soon as the data
      is stored; processing continues in the background. Partner systems poll
      `GET /api/v1/hub/ingest/transactions/{id}` with the same API key / connection
      token used for the push. ARIS operators can also use
      `GET /api/v1/hub/transactions/{id}` (user JWT — see *Transactions*).

    ## Limits

    | Limit | Value |
    |---|---|
    | Records per push | 10,000 |
    | JSON request body (push, webhook, execute) | 50 MiB — larger payloads get `413`; use file upload |
    | Uploaded file | 100 MB, one file per request |
    | Referential mappings per bulk request | 5,000 |
    | Page size (`limit`) | Hub endpoints: max 100 (default 20). Master data and direct exports: max 500. |
    | Login / refresh | 10 requests per minute per IP (`429` with `Retry-After`) |

    ## Conventions

    * Responses use the envelope `{ "data": …, "meta"?: { "total", "page", "limit", "pages"? } }`.
    * Errors use `{ "statusCode", "message", "errors"?: [{ "field", "message" }] }`.
      Unknown or invalid fields in a request body return `400` (e.g. `Unknown field "colour"`),
      and a unique-value clash returns `409`.
      Some credential-service messages are currently returned in French.
    * Hub resources use `snake_case` fields; credential, master-data and direct-export
      resources use `camelCase`.
    * Timestamps are ISO 8601 UTC. Country codes are ISO 3166-1 alpha-2 (e.g. `KE`).

    ## Data classification

    ARIS classifies data as `PUBLIC`, `PARTNER`, `RESTRICTED` or `CONFIDENTIAL`.
    Individual outbreak records and unconfirmed events are `RESTRICTED`; credentials
    are `CONFIDENTIAL`. Classification is inherited by derived products, and the
    classification agreed for an exchange is recorded on its *agreement*. Official
    WOAH/WAHIS notifications remain the sovereign responsibility of each Member State;
    analytical outputs carry provenance and disclaimers.

servers:
  - url: https://au-aris.org
    description: Production
  - url: https://test.au-aris.org
    description: Staging / sandbox — recommended for integration tests

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Obtain and renew user JWTs for the management and reference endpoints.
  - name: Data ingestion
    description: Send data to ARIS — API push, file upload and signed webhook — and poll the result of a push.
  - name: Transactions
    description: Track, review (approve/reject), retry and cancel exchanges.
  - name: Connections
    description: Partner systems connected to ARIS, their credentials and health.
  - name: Mappings
    description: Code (referential) and field mappings applied by pipelines for a connection.
  - name: Pipelines
    description: Processing pipelines and their steps; manual execution.
  - name: Schedules
    description: Recurring execution schedules for pipelines.
  - name: Agreements
    description: Bilateral data exchange agreements (scope, classification, SLA) and their workflow.
  - name: Monitoring
    description: Hub KPIs, volumes, connection health, recent errors and the hub audit trail.
  - name: Direct exports
    description: |
      Legacy direct export endpoints for WAHIS (WOAH), EMPRES (FAO) and FAOSTAT. They
      remain available for existing integrations; new integrations should use
      outbound hub pipelines. Retired country-ingestion endpoints are listed here as
      deprecated.
  - name: Reference data
    description: |
      ARIS master data (geography, species, diseases, units) used to build referential
      mappings. Use the ARIS `code` values as `target_code` in referential mappings.

paths:
  # ═══════════════════════════ AUTHENTICATION ═══════════════════════════
  /api/v1/credential/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in and obtain tokens
      description: |
        Authenticates a user (or service account) and returns an access token (JWT
        RS256, 15 minutes) and a refresh token.

        * **Rate limited**: 10 requests per minute per client IP (`429` + `Retry-After`).
        * **MFA**: if TOTP is enabled on the account and `totpCode` is omitted, the
          response is `200` with `mfaRequired: true` and empty tokens; repeat the call
          with `totpCode`.
        * **Lockout**: repeated failures temporarily lock the account (`401`).
        * **Single session**: a new login revokes the previous session of the same
          account on the same device class. Use one dedicated service account per
          partner system.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: svc-klhis@ke.au-aris.org
              password: '••••••••••••'
      responses:
        '200':
          description: Authenticated, or MFA code required.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaRequiredResponse'
              examples:
                success:
                  summary: Tokens issued
                  value:
                    data:
                      accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI…
                      refreshToken: ZDRmNmE3YjItOGMxZS00ZjNhLTkyYjAtMWU1YzZkN2U4ZjkwOjc…
                      expiresIn: 900
                      user:
                        id: d4f6a7b2-8c1e-4f3a-92b0-1e5c6d7e8f90
                        email: svc-klhis@ke.au-aris.org
                        firstName: KLHIS
                        lastName: Integration
                        role: INTEROP_MANAGER
                        roles: [INTEROP_MANAGER]
                        tenantId: 1e7b4c2a-9d3f-4a5b-8c6d-7e8f9a0b1c2d
                        tenantLevel: MEMBER_STATE
                        domains: []
                        mustChangePassword: false
                      permissions: {}
                mfa:
                  summary: MFA required
                  value:
                    data:
                      mfaRequired: true
                      accessToken: ''
                      refreshToken: ''
                      expiresIn: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong credentials, invalid TOTP code, inactive or locked account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                message: Adresse e-mail ou mot de passe incorrect
        '403':
          description: Temporary account expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/credential/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Renew the access token
      description: |
        Exchanges a refresh token for a new access token **and a new refresh token**.
        Refresh tokens are single-use (rotated): always store the new one. A refresh
        token is rejected (`401`, code `SESSION_REVOKED_NEW_DEVICE`) if the account
        has logged in again elsewhere. Rate limited to 10 requests/minute per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: ZDRmNmE3YjItOGMxZS00ZjNhLTkyYjAtMWU1YzZkN2U4ZjkwOjc…
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                data:
                  accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9…
                  refreshToken: ZDRmNmE3YjItOGMxZS00ZjNhLTkyYjAtMWU1YzZkN2U4ZjkwOjg…
                  expiresIn: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid, expired or revoked session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                message: Votre session a été fermée car une nouvelle connexion a été ouverte depuis un autre appareil.
                code: SESSION_REVOKED_NEW_DEVICE
        '403':
          description: Temporary account expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/credential/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Log out
      description: Blacklists the current access token and deletes all refresh tokens of the account.
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
              example:
                data:
                  message: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════════════ DATA INGESTION ═══════════════════════════
  /api/v1/hub/ingest/push:
    post:
      tags: [Data ingestion]
      operationId: ingestPush
      summary: Push records (API push)
      description: |
        Sends a batch of records from a partner system. The connection is identified
        by its credential:

        * `X-API-Key: <key>` — matched against the connection's `credentials.apiKey`
          (or `api_key`), **or**
        * `Authorization: Bearer <token>` — matched against `credentials.token`
          (or `bearerToken`). This is a **connection token, not a user JWT**.

        If both headers are sent, `X-API-Key` takes precedence. Only connections with
        `status=ACTIVE` and `direction=INBOUND` are considered.

        The hub selects the connection's ACTIVE INBOUND pipeline for `domain`. `domain`
        may be omitted only when the connection receives a single domain; otherwise
        the request is refused with `422`. The hub stores the records in a new
        transaction (`QUEUED`) and returns **`202 Accepted`** immediately. Processing (mapping, validation, optional manual review,
        loading) continues in the background.

        **Body formats** — records are taken from, in order: `records` (array),
        `payload` (array), or `payload` (single object = one record). Each record is a
        flat or nested JSON object using your own field names and codes; the
        connection's mappings translate them.

        **Limits** — 1 to 10,000 records, and a request body of at most 50 MiB. Split
        larger batches or use file upload.

        **Retries** — send an `Idempotency-Key` header (e.g. a UUID, or your batch ID)
        so that a request repeated after a timeout or network error is not processed
        twice. A repeat with the same key and the same records returns `200` with the
        original `transaction_id` and the header `Idempotent-Replayed: true`; the same
        key with different records is refused with `422`. Keys are kept per connection,
        without expiry.

        **Tracking** — keep the returned `transaction_id` and poll
        `GET /api/v1/hub/ingest/transactions/{id}` with the **same** `X-API-Key` /
        connection token until the status is final (`AWAITING_REVIEW`, `COMPLETED`,
        `PARTIAL`, `FAILED`, `REJECTED` or `CANCELLED`). A polling interval of
        10–30 seconds is recommended. Management and transaction-review endpoints
        (`/api/v1/hub/transactions`, connections, mappings, …) still require a user JWT.

        ```bash
        curl -X POST https://test.au-aris.org/api/v1/hub/ingest/push \
          -H "X-API-Key: $ARIS_API_KEY" \
          -H "Idempotency-Key: KLHIS-batch-2026-10-30-001" \
          -H "Content-Type: application/json" \
          -d '{
                "domain": "animal-health",
                "entity_type": "health_events",
                "records": [{
                  "event_id": "KLHIS-2026-000184",
                  "disease_code": "FMD-KE",
                  "species_code": "CTL",
                  "admin2_code": "KE-01",
                  "report_date": "2026-10-28",
                  "cases": 14, "deaths": 2, "susceptible": 320
                }]
              }'
        ```
      security:
        - apiKeyAuth: []
        - connectionToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestPushRequest'
            examples:
              records:
                summary: Batch of outbreak reports (Kenya, FMD in cattle)
                value:
                  domain: animal-health
                  entity_type: health_events
                  records:
                    - event_id: KLHIS-2026-000184
                      disease_code: FMD-KE
                      species_code: CTL
                      admin2_code: KE-01
                      report_date: '2026-10-28'
                      onset_date: '2026-10-24'
                      cases: 14
                      deaths: 2
                      susceptible: 320
                      latitude: -4.05
                      longitude: 39.67
                    - event_id: KLHIS-2026-000185
                      disease_code: FMD-KE
                      species_code: CTL
                      admin2_code: KE-02
                      report_date: '2026-10-29'
                      cases: 6
                      deaths: 0
                      susceptible: 150
              singlePayload:
                summary: Single record in `payload`
                value:
                  domain: animal-health
                  payload:
                    event_id: KLHIS-2026-000186
                    disease_code: FMD-KE
                    species_code: CTL
                    admin2_code: KE-03
                    report_date: '2026-10-30'
                    cases: 3
      responses:
        '200':
          description: |
            Repeated request: the `Idempotency-Key` was already used with the same records.
            Nothing is processed again; the original transaction is returned.
          headers:
            Idempotent-Replayed:
              description: Always `true` on a replayed request.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAccepted'
              example:
                data:
                  transaction_id: 6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80
                  status: COMPLETED
                  records_received: 2
                  message: Request already received with this Idempotency-Key; returning the original transaction
        '202':
          description: Records stored; processing queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAccepted'
              examples:
                automatic:
                  value:
                    data:
                      transaction_id: 6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80
                      status: QUEUED
                      records_received: 2
                      message: Data queued for processing
                manual:
                  value:
                    data:
                      transaction_id: 6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80
                      status: QUEUED
                      records_received: 2
                      message: Data queued; it will await manual review before loading
        '400':
          description: Missing body content, empty batch, more than 10,000 records or invalid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    statusCode: 400
                    message: records[] or payload is required
                empty:
                  value:
                    statusCode: 400
                    message: records[] must contain at least one record
                tooMany:
                  value:
                    statusCode: 400
                    message: Maximum 10,000 records per push. Split larger batches.
        '401':
          description: No credential, or it matches no active inbound connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                message: Invalid or missing API key / bearer token. Could not identify connection.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: |
            No ACTIVE INBOUND pipeline for the domain; `domain` missing although the
            connection receives several domains; or `Idempotency-Key` reused with other records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noPipeline:
                  value:
                    statusCode: 422
                    message: No active inbound pipeline found for connection "Kenya KLHIS" and domain "animal-health"
                domainRequired:
                  value:
                    statusCode: 422
                    message: 'Connection "Kenya KLHIS" receives several domains (animal-health, livestock): send "domain" to choose one'
                idempotencyConflict:
                  value:
                    statusCode: 422
                    message: This Idempotency-Key was already used with a different payload

  /api/v1/hub/ingest/transactions/{id}:
    get:
      tags: [Data ingestion]
      operationId: getIngestTransactionStatus
      summary: Get the status of a pushed transaction
      description: |
        Returns the processing status and per-record results of a transaction, for
        the partner system that sent it. Authenticate with the **same credential as
        the push** (`X-API-Key` or connection `Authorization: Bearer <token>`); only
        transactions of that connection are visible (others return `404`). It works
        for transactions created by push, webhook or upload on that connection.

        Per-record results (`records`) are written when processing finishes; while
        the transaction is still running (or waiting in `AWAITING_REVIEW`) the array
        is empty. `submission_id` is the ID of the ARIS data-collection submission
        created for an accepted inbound record.

        ```bash
        curl https://test.au-aris.org/api/v1/hub/ingest/transactions/6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80 \
          -H "X-API-Key: $ARIS_API_KEY"
        ```
      security:
        - apiKeyAuth: []
        - connectionToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The `transaction_id` returned by the ingest call.
          schema:
            type: string
            format: uuid
          example: 6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80
      responses:
        '200':
          description: Transaction status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestTransactionStatus'
              examples:
                partial:
                  summary: Finished, one record rejected
                  value:
                    data:
                      transaction_id: 6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80
                      status: PARTIAL
                      records_total: 2
                      records_accepted: 1
                      records_rejected: 1
                      error_message: 1 record(s) rejected
                      started_at: '2026-11-06T08:15:02.114Z'
                      completed_at: '2026-11-06T08:15:04.870Z'
                      records:
                        - record_index: 0
                          status: ACCEPTED
                          error_message: null
                          submission_id: 7c1e3a5b-9d2f-4b6e-8a0c-1d3e5f7a9b2c
                        - record_index: 1
                          status: REJECTED
                          error_message: 'Collecte 400: admin2_code KE-99 is not a valid administrative unit'
                          submission_id: null
                review:
                  summary: Waiting for manual review
                  value:
                    data:
                      transaction_id: 6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80
                      status: AWAITING_REVIEW
                      records_total: 2
                      records_accepted: 0
                      records_rejected: 0
                      error_message: null
                      started_at: '2026-11-06T08:15:02.114Z'
                      completed_at: null
                      records: []
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 400
                message: Invalid transaction id
        '401':
          description: No credential, or it matches no active inbound connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                message: Invalid or missing API key / bearer token. Could not identify connection.
        '404':
          description: No transaction with this id for the authenticated connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 404
                message: Transaction not found

  /api/v1/hub/ingest/upload:
    post:
      tags: [Data ingestion]
      operationId: ingestUpload
      summary: Upload a data file
      description: |
        Uploads one file of records for a connection of the caller's tenant. The file
        is parsed immediately (a bad file is rejected with `400`), stored, and processed
        in the background by the connection's ACTIVE INBOUND pipeline (for `domain` if
        given). Returns **`202 Accepted`**.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.

        **Supported formats** (by file extension):
        * `.csv` — header row + data rows; separator `,` or `;` auto-detected from the
          header (French-locale Excel exports use `;`); RFC 4180 quoting; UTF-8 (BOM allowed).
        * `.tsv` — tab-separated, same rules.
        * `.json` — an array of objects, or an object with a `records` or `data` array.

        In CSV/TSV, values that look like numbers (`-12`, `3.5`) are converted to
        numbers; everything else stays a string. Maximum size 100 MB, one file.

        > **Field order matters:** send the text fields (`connection_id`, `domain`,
        > `entity_type`) **before** the `file` part of the multipart body, otherwise
        > they are not read and the request fails with
        > `connection_id field is required`.

        ```bash
        curl -X POST https://test.au-aris.org/api/v1/hub/ingest/upload \
          -H "Authorization: Bearer $ARIS_JWT" \
          -F connection_id=3f1c2a9e-5b7d-4e8a-9c21-6d0f4b8a7e11 \
          -F domain=animal-health \
          -F entity_type=health_events \
          -F file=@ke_fmd_outbreaks_2026Q3.csv
        ```
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IngestUploadRequest'
            encoding:
              file:
                contentType: text/csv, text/tab-separated-values, application/json
      responses:
        '202':
          description: File stored and queued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAccepted'
              example:
                data:
                  transaction_id: 0c4e8a2f-7d1b-4e6a-b3c9-5f2a1d8e7b60
                  status: QUEUED
                  file_name: ke_fmd_outbreaks_2026Q3.csv
                  file_size: 48213
                  records_received: 412
                  message: File queued; it will await manual review before loading
        '400':
          description: Missing file or `connection_id`, no active inbound pipeline, unsupported or unparsable file, empty file, or storage failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noConnection:
                  value:
                    statusCode: 400
                    message: connection_id field is required
                format:
                  value:
                    statusCode: 400
                    message: 'Unsupported file format: .xlsx. Supported: .json, .csv, .tsv'
                noPipeline:
                  value:
                    statusCode: 400
                    message: No active inbound pipeline found for this connection and domain "animal-health"
                empty:
                  value:
                    statusCode: 400
                    message: File must have a header row and at least one data row
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Connection not found in the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 404
                message: Connection not found
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/v1/hub/ingest/webhook/{connectionId}:
    post:
      tags: [Data ingestion]
      operationId: ingestWebhook
      summary: Receive a signed webhook
      description: |
        Event-driven delivery from a partner system to an ACTIVE INBOUND connection.
        The body is either `{ "records": [ … ] }` (several records) or any other JSON
        object, which is treated as **one** record. Returns **`202 Accepted`**.

        **Domain.** If the connection receives several domains, say which one with
        `?domain=…` or a top-level `"domain"` next to `"records"`; otherwise the request
        is refused with `422`. With a single domain it can be omitted.

        **Signature (mandatory).** Compute HMAC-SHA256 over the **exact raw bytes** of
        the request body with the connection's webhook secret, and send it in
        `X-Webhook-Signature` as lowercase/uppercase hex (optionally prefixed with
        `sha256=`) or as base64. Sign the exact string you send — re-serialising the
        JSON after signing will break the signature. `Content-Type` must be
        `application/json`. Requests are rejected with `401` if the connection has no
        webhook secret configured, the header is missing, or the signature does not
        match.

        **Retries.** Send an `Idempotency-Key` header (e.g. your event ID). A repeat with
        the same key and body returns `200` with the original transaction and is not
        processed again; the same key with a different body gets `422`.

        **Node.js**
        ```js
        const crypto = require('node:crypto');

        const body = JSON.stringify({ records: [{ event_id: 'KLHIS-2026-000184',
          disease_code: 'FMD-KE', species_code: 'CTL', admin2_code: 'KE-01', cases: 14 }] });
        const signature = crypto.createHmac('sha256', process.env.ARIS_WEBHOOK_SECRET)
          .update(body, 'utf8').digest('hex');

        await fetch(`https://test.au-aris.org/api/v1/hub/ingest/webhook/${connectionId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Webhook-Signature': `sha256=${signature}` },
          body,                       // send exactly the bytes that were signed
        });
        ```

        **Python**
        ```python
        import hashlib, hmac, json, os, requests

        payload = {"records": [{"event_id": "KLHIS-2026-000184", "disease_code": "FMD-KE",
                                "species_code": "CTL", "admin2_code": "KE-01", "cases": 14}]}
        body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
        signature = hmac.new(os.environ["ARIS_WEBHOOK_SECRET"].encode("utf-8"),
                             body, hashlib.sha256).hexdigest()

        requests.post(
            f"https://test.au-aris.org/api/v1/hub/ingest/webhook/{connection_id}",
            data=body,  # raw bytes, not json=
            headers={"Content-Type": "application/json",
                     "X-Webhook-Signature": "sha256=" + signature},
            timeout=30,
        )
        ```
      security:
        - webhookSignature: []
      parameters:
        - name: connectionId
          in: path
          required: true
          description: ID of the inbound connection (provided by ARIS).
          schema:
            type: string
            format: uuid
          example: 3f1c2a9e-5b7d-4e8a-9c21-6d0f4b8a7e11
        - name: domain
          in: query
          required: false
          description: ARIS domain of the records, required when the connection receives several domains.
          schema:
            type: string
            example: animal-health
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
            examples:
              batch:
                value:
                  records:
                    - event_id: KLHIS-2026-000184
                      disease_code: FMD-KE
                      species_code: CTL
                      admin2_code: KE-01
                      report_date: '2026-10-28'
                      cases: 14
                      deaths: 2
              single:
                value:
                  event_id: KLHIS-2026-000187
                  disease_code: FMD-KE
                  species_code: CTL
                  admin2_code: KE-04
                  report_date: '2026-11-02'
                  cases: 9
      responses:
        '200':
          description: Repeated request with the same `Idempotency-Key` and body; the original transaction is returned.
          headers:
            Idempotent-Replayed:
              description: Always `true` on a replayed request.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAccepted'
        '202':
          description: Payload accepted and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAccepted'
              example:
                data:
                  transaction_id: 9e2b7c41-3d5f-4a68-b0c1-2d3e4f5a6b7c
                  status: QUEUED
                  message: Webhook payload received
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Secret not configured, signature header missing, or invalid signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    statusCode: 401
                    message: Missing webhook signature header (x-webhook-signature)
                invalid:
                  value:
                    statusCode: 401
                    message: Invalid webhook signature
                noSecret:
                  value:
                    statusCode: 401
                    message: Webhook secret not configured for this connection
        '404':
          description: Connection does not exist, is not ACTIVE, or is not INBOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 404
                message: Connection not found or inactive
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: No ACTIVE INBOUND pipeline for the domain, `domain` missing although several are possible, or `Idempotency-Key` reused with another body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noPipeline:
                  value:
                    statusCode: 422
                    message: No active inbound pipeline found for connection "Kenya KLHIS"
                domainRequired:
                  value:
                    statusCode: 422
                    message: 'Connection "Kenya KLHIS" receives several domains (animal-health, livestock): send "domain" to choose one'
                idempotencyConflict:
                  value:
                    statusCode: 422
                    message: This Idempotency-Key was already used with a different payload

