        - $ref: '#/components/parameters/RefLimit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Page of feed records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeedRecord'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/interop/faostat/sync:
    post:
      tags: [Direct exports]
      operationId: createFaostatSync
      summary: Reconcile FAOSTAT denominators
      description: |
        Imports FAOSTAT population figures for a country/year and reconciles them with
        ARIS denominators, reporting discrepancies. Check `data.status`.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaostatSyncRequest'
            example:
              countryCode: KE
              year: 2025
              sourceUrl: https://www.fao.org/faostat/en/#data/QCL
              records:
                - countryCode: KE
                  speciesCode: BOS-TAU
                  year: 2025
                  population: 22100000
                  source: FAOSTAT
      responses:
        '201':
          description: Sync record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SyncRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/interop/export/faostat:
    post:
      tags: [Direct exports]
      operationId: exportFaostat
      summary: Generate a FAOSTAT CSV export
      description: |
        Exports data in FAOSTAT CSV layout for an indicator: `QCL` (crops and
        livestock products), `QL` (livestock), `TM` (trade matrix). An unknown
        indicator yields an export record with `status: FAILED`. Check `data.status`.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaostatExportRequest'
            example:
              indicatorCode: QL
              countryIso: [KE, ET]
              yearRange: [2022, 2025]
      responses:
        '201':
          $ref: '#/components/responses/ExportRecordResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

