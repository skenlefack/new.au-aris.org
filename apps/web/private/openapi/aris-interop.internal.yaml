  # ═══════════════════════════ REFERENCE DATA ═══════════════════════════
  /api/v1/master-data/geo:
    get:
      tags: [Reference data]
      operationId: listGeoEntities
      summary: List geographic entities
      description: |
        Active countries, administrative units and special zones. Use `code` (e.g.
        `KE`, `KE-01`) as the ARIS target code for `GEO_COUNTRY` / `GEO_ADMIN`
        mappings. Any authenticated user.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/RefLimit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/GeoLevel'
        - name: countryCode
          in: query
          schema:
            type: string
          example: KE
        - name: parentId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Case-insensitive match on name, English name or code.
          schema:
            type: string
          example: Mombasa
      responses:
        '200':
          description: Page of geographic entities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GeoEntity'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - id: 7a1c3e5b-9d2f-4b6e-8a0c-2e4f6a8b0c1d
                    code: KE-01
                    name: { en: Mombasa, fr: Mombasa, pt: '', ar: '' }
                    nameEn: Mombasa
                    nameFr: Mombasa
                    level: ADMIN2
                    parentId: 0b2d4f6a-8c1e-4a3c-9e5f-7b9d1f3a5c7e
                    countryCode: KE
                    centroidLat: -4.05
                    centroidLng: 39.67
                    latitude: -4.05
                    longitude: 39.67
                    isActive: true
                    version: 1
                    parentName: { en: Kenya, fr: Kenya, pt: Quénia, ar: كينيا }
                meta: { total: 1, page: 1, limit: 20 }
        '401':
          $ref: '#/components/responses/Unauthorized'

