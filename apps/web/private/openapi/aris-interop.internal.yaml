  /api/v1/hub/transactions/{id}/approve:
    post:
      tags: [Transactions]
      operationId: approveTransaction
      summary: Approve a transaction under review
      description: |
        Approves a `MANUAL`-mode transaction in `AWAITING_REVIEW`, then **synchronously**
        runs the remaining pipeline steps after `NOTIFY` (loading into ARIS for
        inbound, delivery for outbound) and returns the final transaction. The call
        stays open until loading finishes: inbound records are submitted up to 5 at a
        time, so allow roughly 10 s + 1.5 s per 5 records (about 50 minutes for
        10,000 records) and set your HTTP client timeout accordingly. An asynchronous
        approve is not available yet.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
            example:
              notes: Codes verified against the KLHIS 2026 dictionary.
      responses:
        '200':
          description: Approved and processed; the final transaction is returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HubTransactionDetail'
        '400':
          description: Not a MANUAL transaction, not in AWAITING_REVIEW, or the pipeline has no NOTIFY step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 400
                message: 'Transaction must be in AWAITING_REVIEW status (current: COMPLETED)'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/transactions/{id}/reject:
    post:
      tags: [Transactions]
      operationId: rejectTransaction
      summary: Reject a transaction under review
      description: |
        Rejects a `MANUAL`-mode transaction in `AWAITING_REVIEW`. Nothing is loaded or
        delivered. `notes` (or `reason`) is stored as `review_notes`.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
            example:
              reason: Duplicate of transaction 0c4e8a2f; species codes not mapped.
      responses:
        '200':
          description: Transaction rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HubTransaction'
        '400':
          description: Not a MANUAL transaction or not in AWAITING_REVIEW.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/transactions/{id}/retry:
    post:
      tags: [Transactions]
      operationId: retryTransaction
      summary: Retry a failed transaction
      description: |
        Re-runs the pipeline on the original records of a `FAILED` or `PARTIAL`
        transaction (same transaction ID). Previous per-record results are deleted,
        `retry_count` is incremented and the status becomes `RETRY`; processing runs
        in the background. Allowed while `retry_count < max_retries`.

        Note: retrying a `PARTIAL` inbound transaction re-submits **all** records,
        including those already loaded.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Queued for retry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HubTransaction'
                  message:
                    type: string
                    example: Transaction queued for retry
        '400':
          description: Status is not FAILED/PARTIAL, or maximum retries reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 400
                message: Maximum retries (3) exceeded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/transactions/{id}/cancel:
    post:
      tags: [Transactions]
      operationId: cancelTransaction
      summary: Cancel a transaction
      description: |
        Marks a transaction `CANCELLED` (any status except `COMPLETED` and
        `CANCELLED`). Cancelling does not interrupt a pipeline run that is already in
        progress.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HubTransaction'
        '400':
          description: Transaction already COMPLETED or CANCELLED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

