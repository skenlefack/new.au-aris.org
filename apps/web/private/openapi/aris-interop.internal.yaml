                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ═══════════════════════════ DIRECT EXPORTS (legacy) ═══════════════════════════
  /api/v1/interop/wahis/export:
    post:
      tags: [Direct exports]
      operationId: createWahisExport
      summary: Generate a WAHIS-ready package for a period
      description: |
        Builds a WOAH-format package (JSON or XML) of the country's WAHIS-ready
        animal-health events (validated up to Level 2) for the period and stores it.
        Returns `201` with an export record whose `status` is `COMPLETED` (with a
        time-limited `packageUrl`, valid 1 hour) or `FAILED` (with `errorMessage`) —
        always check `data.status`.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `WAHIS_FOCAL_POINT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WahisExportRequest'
            example:
              countryCode: KE
              periodStart: '2026-07-01'
              periodEnd: '2026-12-31'
              format: WOAH_XML
      responses:
        '201':
          $ref: '#/components/responses/ExportRecordResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/interop/export/wahis:
    post:
      tags: [Direct exports]
      operationId: exportWahisQuarter
      summary: Generate a quarterly WAHIS XML export
      description: |
        Builds a WAHIS XML file for a country and quarter, grouped by disease
        (optionally limited to `diseases`). Same response semantics as
        `POST /api/v1/interop/wahis/export`.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `WAHIS_FOCAL_POINT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WahisQuarterExportRequest'
            example:
              countryIso: KE
              year: 2026
              quarter: 3
              diseases: [FMD]
      responses:
        '201':
          $ref: '#/components/responses/ExportRecordResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/interop/wahis/exports:
    get:
      tags: [Direct exports]
      operationId: listWahisExports
      summary: List WAHIS exports
      description: Any authenticated user; results are limited to the caller's tenant scope.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/RefLimit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          $ref: '#/components/responses/ExportRecordPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/interop/wahis/exports/{id}:
    get:
      tags: [Direct exports]
      operationId: getWahisExport
      summary: Get an export record
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/ExportRecordResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/interop/empres/feed:
    post:
      tags: [Direct exports]
      operationId: createEmpresFeed
      summary: Record an EMPRES signal for a health event
      description: |
        Builds an EMPRES signal for one health event and records it as a feed record.
        **Transmission to FAO EMPRES-i is currently simulated** (no live FAO endpoint
        is called); the record reflects the generated payload.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `DATA_STEWARD`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresFeedRequest'
            example:
              healthEventId: 4f6a8c0e-2b4d-4f6a-8c0e-2b4d6f8a0c2e
              diseaseCode: FMD
              countryCode: KE
              confidenceLevel: CONFIRMED
              context: Laboratory-confirmed FMD (serotype O) in a cattle herd, Mombasa County
              coordinates: { lat: -4.05, lng: 39.67 }
              species: [BOS-TAU]
              cases: 14
              deaths: 2
      responses:
        '201':
          description: Feed record (check `data.status`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FeedRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/interop/export/empres:
    post:
      tags: [Direct exports]
      operationId: exportEmpres
      summary: Generate an EMPRES-i JSON export
      description: |
        Exports confirmed health events with coordinates for a country (default
        period: last 90 days) in EMPRES-i JSON. Check `data.status`.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `DATA_STEWARD`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresExportRequest'
            example:
              countryIso: KE
              dateFrom: '2026-08-01'
              dateTo: '2026-10-31'
              diseaseFilter: [FMD]
      responses:
        '201':
          $ref: '#/components/responses/ExportRecordResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/interop/empres/feeds:
    get:
      tags: [Direct exports]
      operationId: listEmpresFeeds
      summary: List EMPRES feed records
      parameters:
