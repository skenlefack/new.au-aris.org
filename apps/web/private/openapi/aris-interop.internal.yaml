  /api/v1/hub/audit:
    get:
      tags: [Monitoring]
      operationId: listHubAuditLogs
      summary: Hub audit trail
      description: |
        Audit entries for hub actions in the caller's tenant (create/update/delete,
        activate, upload, approve, reject, retry, cancel, …), newest first.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/HubLimit'
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [connection, pipeline, transaction, agreement, schedule, referential_mapping, field_mapping]
        - name: action
          in: query
          schema:
            type: string
          example: APPROVE
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: date_from
          in: query
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Page of audit entries.
          content:
            application/json:
              schema:
                type: object
                properties:
