  # ═══════════════════════════ MONITORING ═══════════════════════════
  /api/v1/hub/dashboard/overview:
    get:
      tags: [Monitoring]
      operationId: getDashboardOverview
      summary: Hub KPIs
      description: |
        Counts for the caller's tenant: connections, active pipelines, transactions
        and failures today (server time), pending reviews and today's error rate (%).

        **Roles (all Monitoring endpoints):** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`, `REC_ADMIN`, `NATIONAL_ADMIN`.
      responses:
        '200':
          description: KPIs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DashboardOverview'
              example:
                data:
                  active_connections: 6
                  total_connections: 8
                  active_pipelines: 7
                  transactions_today: 42
                  failed_today: 1
                  pending_review: 3
                  error_rate: 2.38
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/hub/dashboard/volume:
    get:
      tags: [Monitoring]
      operationId: getDashboardVolume
      summary: Transaction volume over time
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: day
      responses:
        '200':
          description: Volume series.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VolumePoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/hub/dashboard/status:
    get:
      tags: [Monitoring]
      operationId: getDashboardStatus
      summary: Transaction counts by status
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          $ref: '#/components/schemas/HubTransactionStatus'
                        count:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/hub/dashboard/connections:
    get:
      tags: [Monitoring]
      operationId: getDashboardConnections
      summary: Per-connection statistics
      description: Counters, health, success rate (%) and average latency per connection.
