        - name: search
          in: query
          description: Case-insensitive match on English common name, scientific name or code.
          schema:
            type: string
          example: cattle
      responses:
        '200':
          description: Page of species.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Species'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - id: 2c4e6a8b-0d1f-4a3c-8e5a-7c9e1a3c5e7a
                    code: BOS-TAU
                    scientificName: Bos taurus
                    commonNameEn: Cattle (taurine)
                    commonNameFr: Bovin (taurin)
                    category: DOMESTIC
                    productionCategories: [dairy, beef, draught]
                    isWoahListed: true
                    isActive: true
                    version: 1
                meta: { total: 1, page: 1, limit: 20 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/master-data/species-groups:
    get:
      tags: [Reference data]
      operationId: listSpeciesGroups
      summary: Species categories with counts
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        category:
                          $ref: '#/components/schemas/SpeciesCategory'
                        count:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/master-data/species/{id}:
    get:
      tags: [Reference data]
      operationId: getSpecies
      summary: Get a species
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Species.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Species'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/master-data/diseases:
    get:
      tags: [Reference data]
      operationId: listDiseases
      summary: List diseases
      description: |
        Active diseases (WOAH-listed and others). Use `code` (e.g. `FMD`) as the
        target code for `DISEASE` mappings.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/RefLimit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: isWoahListed
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: isNotifiable
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: search
          in: query
          description: Case-insensitive match on English name, French name or code.
          schema:
            type: string
          example: foot and mouth
      responses:
        '200':
          description: Page of diseases.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Disease'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - id: 5e7a9c1e-3b5d-4f7a-9c1e-3b5d7f9a1c3e
                    code: FMD
                    nameEn: Foot and mouth disease
                    nameFr: Fièvre aphteuse
                    namePt: Febre aftosa
                    nameAr: الحمى القلاعية
                    isWoahListed: true
                    affectedSpecies: [BOS-TAU, BOS-IND, OVI-ARI, CAP-HIR, SUS-DOM, SYN-CAF, BUB-BUB]
                    isNotifiable: true
                    wahisCategory: multiple_species
                    isActive: true
                    version: 1
                meta: { total: 1, page: 1, limit: 20 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/master-data/diseases/{id}:
    get:
      tags: [Reference data]
      operationId: getDisease
      summary: Get a disease
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Disease.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Disease'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/master-data/units:
    get:
      tags: [Reference data]
      operationId: listUnits
      summary: List units of measure
      description: Use `code` (e.g. `HEAD`) as the target code for `UNIT` mappings.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/RefLimit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/UnitCategory'
        - name: search
          in: query
          description: Case-insensitive match on English name, code or symbol.
          schema:
            type: string
      responses:
        '200':
          description: Page of units.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Unit'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/master-data/units/{id}:
    get:
      tags: [Reference data]
      operationId: getUnit
      summary: Get a unit
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Unit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Unit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/i18n/locales:
    get:
      tags: [Reference data]
      operationId: listLocales
      summary: Supported locales
      description: Public, no authentication.
      security: []
      responses:
        '200':
          description: Locales.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        nameEn: { type: string }
                        nameNative: { type: string }
                        rtl: { type: boolean }
              example:
                data:
                  - { code: en, nameEn: English, nameNative: English, rtl: false }
                  - { code: fr, nameEn: French, nameNative: Français, rtl: false }
                  - { code: pt, nameEn: Portuguese, nameNative: Português, rtl: false }
                  - { code: ar, nameEn: Arabic, nameNative: العربية, rtl: true }
                  - { code: es, nameEn: Spanish, nameNative: Español, rtl: false }

  /api/v1/i18n/enums:
    get:
      tags: [Reference data]
      operationId: listEnumTranslations
      summary: Translated enumeration labels
      description: Labels of ARIS enumerations in the requested locale. Public, no authentication.
      security: []
      parameters:
        - name: locale
          in: query
          schema:
            type: string
            enum: [en, fr, pt, ar, es]
            default: en
      responses:
        '200':
          description: Enumeration translations keyed by enum name, then value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User access token (JWT RS256, 15 minutes) from
        `POST /api/v1/credential/auth/login`. Send as `Authorization: Bearer <token>`.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Static API key of an ACTIVE INBOUND connection (stored in the connection's
        `credentials.apiKey`). Accepted only by `POST /api/v1/hub/ingest/push`.
    connectionToken:
      type: http
      scheme: bearer
      description: |
        Static token of an ACTIVE INBOUND connection (`credentials.token`), sent as
        `Authorization: Bearer <token>`. Alternative to `X-API-Key` for
        `POST /api/v1/hub/ingest/push` only. This is not a user JWT.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: |
        HMAC-SHA256 of the raw request body, keyed with the connection's webhook
        secret (`credentials.webhookSecret`). Hex (optionally prefixed `sha256=`) or
        base64.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Unique key for this request (1–255 characters, e.g. a UUID or your batch/event ID).
        Repeating a request with the same key returns the original transaction instead of
        processing the data twice.
      schema:
        type: string
        maxLength: 255
      example: KLHIS-batch-2026-10-30-001
    Page:
      name: page
      in: query
      description: Page number (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
    HubLimit:
      name: limit
      in: query
      description: Page size (max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RefLimit:
      name: limit
      in: query
      description: Page size (max 500).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 20
    Sort:
      name: sort
      in: query
      description: Field to sort by (camelCase field name).
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80
    ConnectionIdPath:
      name: connectionId
      in: path
      required: true
      description: Connection ID (must belong to the caller's tenant).
      schema:
        type: string
        format: uuid
      example: 3f1c2a9e-5b7d-4e8a-9c21-6d0f4b8a7e11
    MappingIdPath:
      name: mappingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 1d3f5b7c-9e1a-4c3e-8b5d-7f9a1c3e5b7d

  responses:
    BadRequest:
      description: Invalid request (missing or invalid fields, invalid JSON, or invalid state transition).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 400
            message: name, system_type, direction, and domains[] are required
    Unauthorized:
      description: Missing, malformed, invalid or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 401
            message: Invalid or expired token
    Forbidden:
      description: The caller's role is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 403
            message: 'Role ANALYST is not authorized. Required: SUPER_ADMIN, CONTINENTAL_ADMIN, INTEROP_MANAGER'
    NotFound:
      description: Resource not found in the caller's tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 404
            message: Transaction not found
    PayloadTooLarge:
      description: Request body larger than 50 MiB (JSON) or file larger than 100 MB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 413
            message: Request body is too large
    TooManyRequests:
      description: Rate limit exceeded. Retry after the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 429
            message: Too many requests, please try again later
    Gone:
      description: Endpoint retired.
      headers:
        Link:
          schema:
            type: string
          description: Successor endpoint, e.g. `</api/v1/hub/ingest/push>; rel="successor-version"`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 410
            message: This endpoint has been retired. Use /api/v1/hub/ingest/push (see the ARIS Interop-Hub specification).
            errors:
              - field: endpoint
                message: Replaced by /api/v1/hub/ingest/push
    TransactionPage:
      description: Page of transactions.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/HubTransactionListItem'
              meta:
                $ref: '#/components/schemas/PaginationMeta'
    ConnectionResult:
      description: The connection.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/HubConnection'
              message:
                type: string
                description: Present when no change was needed.
    PipelineResult:
      description: The pipeline.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/HubPipeline'
    ScheduleResult:
      description: The schedule.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/HubSchedule'
    AgreementResult:
      description: The agreement.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/HubAgreement'
    ExportRecordResult:
      description: Export record. Check `data.status` (`COMPLETED` or `FAILED`).
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/ExportRecord'
          example:
            data:
              id: 4b6d8f0a-2c4e-4a6c-8e0a-2c4e6a8c0e2a
              tenantId: 1e7b4c2a-9d3f-4a5b-8c6d-7e8f9a0b1c2d
              connectorType: WAHIS
              countryCode: KE
              periodStart: '2026-07-01T00:00:00.000Z'
              periodEnd: '2026-12-31T00:00:00.000Z'
              format: WOAH_XML
              status: COMPLETED
              recordCount: 12
              packageUrl: https://…/interop-exports/wahis/KE/2026-Q3/4b6d8f0a-….xml?X-Amz-Expires=3600&…
              packageSize: 18342
              errorMessage: null
              exportedBy: d4f6a7b2-8c1e-4f3a-92b0-1e5c6d7e8f90
              exportedAt: '2026-11-06T10:00:03.000Z'
              createdAt: '2026-11-06T10:00:01.000Z'
              updatedAt: '2026-11-06T10:00:03.000Z'
    ExportRecordPage:
      description: Page of export records.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/ExportRecord'
              meta:
                $ref: '#/components/schemas/PaginationMeta'
    GeoEntityResult:
      description: Geographic entity.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/GeoEntity'

  schemas:
    # ───────── Common ─────────
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
        code:
          type: string
          description: Machine-readable code (credential service only), e.g. `SESSION_EXPIRED`, `SESSION_REVOKED_NEW_DEVICE`.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    PaginationMeta:
      type: object
      required: [total, page, limit]
      properties:
        total:
          type: integer
          example: 57
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        pages:
          type: integer
          description: Total number of pages (hub endpoints only).
          example: 3
    JsonObject:
      type: object
      additionalProperties: true
    Record:
      type: object
      additionalProperties: true
      description: One data record using the partner's own field names and codes.
      example:
        event_id: KLHIS-2026-000184
        disease_code: FMD-KE
        species_code: CTL
        admin2_code: KE-01
        report_date: '2026-10-28'
        cases: 14
        deaths: 2

    # ───────── Enums ─────────
    HubDirection:
      type: string
      enum: [INBOUND, OUTBOUND]
      description: '`INBOUND` = partner → ARIS; `OUTBOUND` = ARIS → partner.'
    HubTransportType:
      type: string
      enum: [REST_API, SFTP, KAFKA, FILE_UPLOAD, WEBHOOK, DHIS2, FHIR, WAHIS, SOAP]
    HubAuthType:
      type: string
      enum: [NONE, BASIC, OAUTH2, API_KEY, BEARER_TOKEN, CERTIFICATE, HMAC]
    HubConnectionStatus:
      type: string
      enum: [DRAFT, TESTING, ACTIVE, SUSPENDED, ARCHIVED]
    HubPipelineMode:
      type: string
      enum: [AUTOMATIC, MANUAL]
      description: '`MANUAL` stops at the `NOTIFY` step for human approval.'
    HubPipelineStatus:
      type: string
      enum: [DRAFT, ACTIVE, PAUSED, ERROR, ARCHIVED]
    HubTransactionStatus:
      type: string
      enum: [RECEIVED, QUEUED, MAPPING, TRANSFORMING, VALIDATING, AWAITING_REVIEW, APPROVED, REJECTED, LOADING, COMPLETED, PARTIAL, FAILED, RETRY, CANCELLED]
    HubStepType:
      type: string
      enum: [RECEIVE, REFERENTIAL_MAP, FIELD_TRANSFORM, SCHEMA_VALIDATE, QUALITY_GATE, ENRICH, FORMAT_BUILD, ROUTE, NOTIFY, DELIVER]
    HubStepOnError:
      type: string
      enum: [STOP, SKIP, RETRY, CONTINUE]
      description: |
        Behaviour when the step fails: `STOP` fails the transaction; `SKIP` and
        `CONTINUE` go on to the next step; `RETRY` ends the run with status `RETRY`.
    HubStepLogStatus:
      type: string
      enum: [STARTED, COMPLETED, FAILED, SKIPPED]
    HubRecordStatus:
      type: string
      enum: [ACCEPTED, REJECTED, WARNING]
    HubExportFormat:
      type: string
      enum: [WOAH_JSON, WOAH_XML, EMPRES_JSON, FAOSTAT_CSV, FAOSTAT_JSON, FISHSTATJ_CSV, CITES_CSV, DHIS2_JSON, FHIR_JSON, CSV_GENERIC, JSON_GENERIC, EXCEL]
    HubReferentialType:
      type: string
      enum: [DISEASE, SPECIES, GEO_ADMIN, GEO_COUNTRY, UNIT, LAB, COMMODITY, MARKET, VACCINE, BREED, AGE_GROUP, PRODUCTION_SYSTEM, CUSTOM]
    HubScheduleFrequency:
      type: string
      enum: [REALTIME, HOURLY, DAILY, WEEKLY, BIWEEKLY, MONTHLY, QUARTERLY, BIANNUAL, ANNUAL, ON_DEMAND]
    HubAgreementStatus:
      type: string
      enum: [DRAFT, PROPOSED, UNDER_REVIEW, ACCEPTED, ACTIVE, EXPIRED, REJECTED, REVOKED]
    DataClassification:
      type: string
      enum: [PUBLIC, PARTNER, RESTRICTED, CONFIDENTIAL]
    UserRole:
      type: string
      enum: [SUPER_ADMIN, CONTINENTAL_ADMIN, REC_ADMIN, NATIONAL_ADMIN, DATA_STEWARD, WAHIS_FOCAL_POINT, ANALYST, FIELD_AGENT, DECISION_MAKER, KNOWLEDGE_MANAGER, INTEROP_MANAGER]
    TenantLevel:
      type: string
      enum: [CONTINENTAL, REC, MEMBER_STATE]

    # ───────── Authentication ─────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          format: password
        totpCode:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit TOTP code, required when MFA is enabled on the account.
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        tenantId:
          type: string
          format: uuid
        tenantLevel:
          $ref: '#/components/schemas/TenantLevel'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
        mustChangePassword:
          type: boolean
    LoginResponse:
      type: object
      properties:
        data:
          type: object
          required: [accessToken, refreshToken, expiresIn]
          properties:
            accessToken:
              type: string
              description: JWT RS256 access token.
            refreshToken:
              type: string
              description: Opaque single-use refresh token.
            expiresIn:
              type: integer
              description: Access-token lifetime in seconds.
              example: 900
            user:
              $ref: '#/components/schemas/AuthUser'
            permissions:
              $ref: '#/components/schemas/JsonObject'
    MfaRequiredResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            mfaRequired:
              type: boolean
              const: true
            accessToken:
              type: string
              const: ''
            refreshToken:
              type: string
              const: ''
            expiresIn:
              type: integer
              const: 0
    TokenResponse:
      type: object
      properties:
        data:
          type: object
          required: [accessToken, refreshToken, expiresIn]
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
              example: 900

    # ───────── Ingestion ─────────
    IngestPushRequest:
      type: object
      description: Provide `records` or `payload`.
      properties:
        domain:
          type: string
          description: ARIS domain; selects the inbound pipeline. Required when the connection receives several domains.
          example: animal-health
        entity_type:
          type: string
          description: Overrides the pipeline's entity type on the transaction.
          example: health_events
        records:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: '#/components/schemas/Record'
        payload:
          description: An array of records, or a single record object.
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/Record'
            - $ref: '#/components/schemas/Record'
    IngestAccepted:
      type: object
      properties:
        data:
          type: object
          required: [transaction_id, status, records_received, message]
          properties:
            transaction_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/HubTransactionStatus'
            records_received:
              type: integer
            message:
              type: string
    IngestUploadRequest:
      type: object
      required: [connection_id, file]
      description: Text fields must precede the `file` part.
      properties:
        connection_id:
          type: string
          format: uuid
          description: Inbound connection of the caller's tenant.
        domain:
          type: string
          example: animal-health
        entity_type:
          type: string
          example: health_events
        file:
          type: string
          format: binary
          description: '.csv, .tsv or .json file, max 100 MB.'
    UploadAccepted:
      type: object
      properties:
        data:
          type: object
          properties:
            transaction_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/HubTransactionStatus'
            file_name:
              type: string
            file_size:
              type: integer
              description: Bytes.
            records_received:
              type: integer
            message:
              type: string
    WebhookRequest:
      description: '`{ "records": [...] }` for several records; any other object is one record.'
      anyOf:
        - type: object
          required: [records]
          properties:
            records:
              type: array
              items:
                $ref: '#/components/schemas/Record'
        - $ref: '#/components/schemas/Record'
    WebhookAccepted:
      type: object
      properties:
        data:
          type: object
          properties:
            transaction_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/HubTransactionStatus'
            message:
              type: string

    IngestTransactionStatus:
      type: object
      properties:
        data:
          type: object
          required: [transaction_id, status, records_total, records_accepted, records_rejected, records]
          properties:
            transaction_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/HubTransactionStatus'
            records_total:
              type: integer
            records_accepted:
              type: integer
            records_rejected:
              type: integer
            error_message:
              type: [string, 'null']
            started_at:
              type: [string, 'null']
              format: date-time
            completed_at:
              type: [string, 'null']
              format: date-time
            records:
              type: array
              description: Per-record results, ordered by `record_index` (empty until processing finishes).
              items:
                type: object
                properties:
                  record_index:
                    type: integer
                    description: 0-based position in the pushed batch.
                  status:
                    $ref: '#/components/schemas/HubRecordStatus'
                  error_message:
                    type: [string, 'null']
                  submission_id:
                    type: [string, 'null']
                    format: uuid
                    description: ARIS data-collection submission created for the record (accepted inbound records).

    # ───────── Transactions ─────────
    ConnectionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        country_code:
          type: [string, 'null']
        system_type:
          $ref: '#/components/schemas/HubTransportType'
        direction:
          $ref: '#/components/schemas/HubDirection'
    PipelineSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        domain:
          type: string
        direction:
          $ref: '#/components/schemas/HubDirection'
    HubTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pipeline_id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        direction:
          $ref: '#/components/schemas/HubDirection'
        status:
          $ref: '#/components/schemas/HubTransactionStatus'
        current_step:
          type: [string, 'null']
          description: Name of the step being executed (or `AWAITING_REVIEW`).
        mode:
          $ref: '#/components/schemas/HubPipelineMode'
        domain:
          type: string
        entity_type:
          type: [string, 'null']
        country_code:
          type: [string, 'null']
        target_campaign_id:
          type: [string, 'null']
          format: uuid
        target_form_id:
          type: [string, 'null']
          format: uuid
        export_format:
          oneOf:
            - $ref: '#/components/schemas/HubExportFormat'
            - type: 'null'
        records_total:
          type: integer
        records_accepted:
          type: integer
        records_rejected:
          type: integer
        records_warning:
          type: integer
        source_payload:
          description: Records as received.
          type: [array, object, 'null']
        mapped_payload:
          description: Records after mapping (stored when stopping for review).
          type: [array, object, 'null']
        target_payload:
          description: |
            Final output for COMPLETED/PARTIAL transactions: the loaded records, or —
            when a `FORMAT_BUILD` step ran — the built package (`TargetPackage`).
          oneOf:
            - $ref: '#/components/schemas/TargetPackage'
            - type: array
              items:
                $ref: '#/components/schemas/Record'
            - type: 'null'
        validation_report:
          type: [object, 'null']
        rejection_details:
          type: [object, array, 'null']
        source_file_url:
          type: [string, 'null']
          description: Internal storage key of the uploaded file.
        source_file_name:
          type: [string, 'null']
        source_file_size:
          type: [integer, 'null']
        output_file_url:
          type: [string, 'null']
        output_file_name:
          type: [string, 'null']
        output_file_size:
          type: [integer, 'null']
        delivery_url:
          type: [string, 'null']
        delivery_method:
          type: [string, 'null']
        delivery_status:
          type: [integer, 'null']
          description: HTTP status returned by the partner endpoint.
        delivery_response:
          type: [string, 'null']
          description: Partner response body (truncated to 2,000 characters).
        error_message:
          type: [string, 'null']
        error_details:
          type: [object, 'null']
        retry_count:
          type: integer
        max_retries:
          type: integer
        reviewed_by:
          type: [string, 'null']
          format: uuid
        reviewed_at:
          type: [string, 'null']
          format: date-time
        review_notes:
          type: [string, 'null']
        initiated_by:
          type: string
          format: uuid
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        duration_ms:
          type: [integer, 'null']
        created_at:
          type: string
          format: date-time
    HubTransactionListItem:
      allOf:
        - $ref: '#/components/schemas/HubTransaction'
        - type: object
          properties:
            connection:
              $ref: '#/components/schemas/ConnectionSummary'
            pipeline:
              $ref: '#/components/schemas/PipelineSummary'
    HubTransactionDetail:
      allOf:
        - $ref: '#/components/schemas/HubTransactionListItem'
        - type: object
          properties:
            records:
              type: array
              description: Per-record results (first 200 on the detail endpoint).
              items:
                $ref: '#/components/schemas/HubTransactionRecord'
            steps_log:
              type: array
              items:
                $ref: '#/components/schemas/HubTransactionStepLog'
    HubTransactionRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        record_index:
          type: integer
          description: 0-based position in the batch.
        status:
          $ref: '#/components/schemas/HubRecordStatus'
        error_message:
          type: [string, 'null']
        error_fields:
          type: [array, 'null']
          items:
            type: object
            properties:
              field: { type: string }
              rule: { type: string }
              message: { type: string }
        source_data:
          type: [object, 'null']
        mapped_data:
          type: [object, 'null']
          description: Record after mapping; for loaded inbound records includes `_submission_id`.
        target_data:
          type: [object, 'null']
        submission_id:
          type: [string, 'null']
          format: uuid
        form_entry_id:
          type: [string, 'null']
          format: uuid
        quality_score:
          type: [number, 'null']
        quality_report:
          type: [object, 'null']
        created_at:
          type: string
          format: date-time
    HubTransactionStepLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        step_type:
          $ref: '#/components/schemas/HubStepType'
        step_name:
          type: string
        step_order:
          type: integer
        status:
          $ref: '#/components/schemas/HubStepLogStatus'
        input_summary:
          type: [object, 'null']
        output_summary:
          type: [object, 'null']
        error_message:
          type: [string, 'null']
        duration_ms:
          type: [integer, 'null']
        started_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
    TargetPackage:
      type: object
      description: Package built by a `FORMAT_BUILD` step.
      properties:
        format:
          type: string
          example: WOAH_XML
        filename:
          type: string
          example: wahis_KE_2026-11-06.xml
        content_type:
          type: string
          example: application/xml
        record_count:
          type: integer
        data:
          type: string
          description: Package content (UTF-8 text, or base64 for binary formats).
        encoding:
          type: string
          enum: [utf-8, base64]
    ReviewRequest:
      type: object
      properties:
        notes:
          type: string
    RejectRequest:
      type: object
      properties:
        notes:
          type: string
        reason:
          type: string
          description: Used when `notes` is absent.
    ReasonRequest:
      type: object
      properties:
        reason:
          type: string

    # ───────── Connections ─────────
    FocalPoint:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role: { type: string }
    ConnectionCredentials:
      type: object
      additionalProperties: true
      description: |
        Secrets used by the hub (**write-only**). Recognised keys: `apiKey`/`api_key`
        and `token`/`bearerToken` (inbound push and status polling),
        `webhookSecret`/`webhook_secret` (inbound webhook), `token` (outbound
        BEARER_TOKEN), `header_name` + `api_key` (outbound API_KEY), `username` +
        `password` (outbound BASIC). On update, the value `"********"` keeps the
        stored secret.
      example:
        apiKey: ke-klhis-7f3a9c2e4b6d8f10
        webhookSecret: whsec_2b9f4e7a1c3d5e6f
    MaskedCredentials:
      type: object
      description: |
        Credentials as returned by the API: same keys as stored, every non-empty value
        replaced by `"********"` (all keys are masked, including non-secret ones such
        as `header_name`). Empty strings and nulls are returned as is.
      additionalProperties:
        oneOf:
          - type: string
            enum: ['********', '']
          - type: 'null'
      example:
        apiKey: '********'
        webhookSecret: '********'
    HubConnectionCreate:
      type: object
      required: [name, system_type, direction, domains]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        system_type:
          $ref: '#/components/schemas/HubTransportType'
        system_name:
          type: string
          maxLength: 255
        system_version:
          type: string
          maxLength: 50
        country_code:
          type: string
          maxLength: 3
          description: ISO 3166-1 alpha-2 (null for international organisations).
        country_name:
          type: string
        organization:
          type: string
        base_url:
          type: string
          format: uri
          description: Partner endpoint (outbound delivery and connectivity test).
        auth_type:
          $ref: '#/components/schemas/HubAuthType'
        credentials:
          $ref: '#/components/schemas/ConnectionCredentials'
        headers:
          type: object
          additionalProperties:
            type: string
        tls_config:
          $ref: '#/components/schemas/JsonObject'
        direction:
          $ref: '#/components/schemas/HubDirection'
        domains:
          type: array
          items:
            type: string
          example: [animal-health, livestock-prod]
        focal_technical:
          $ref: '#/components/schemas/FocalPoint'
        focal_data_owner:
          $ref: '#/components/schemas/FocalPoint'
        notes:
          type: string
        config:
          $ref: '#/components/schemas/JsonObject'
    HubConnectionUpdate:
      type: object
      description: Any subset of connection fields, including `status`.
      properties:
        name: { type: string }
        description: { type: string }
        system_name: { type: string }
        system_version: { type: string }
        base_url: { type: string }
        auth_type:
          $ref: '#/components/schemas/HubAuthType'
        credentials:
          $ref: '#/components/schemas/ConnectionCredentials'
        headers:
          type: object
          additionalProperties:
            type: string
        domains:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/HubConnectionStatus'
        focal_technical:
          $ref: '#/components/schemas/FocalPoint'
        focal_data_owner:
          $ref: '#/components/schemas/FocalPoint'
        notes: { type: string }
        config:
          $ref: '#/components/schemas/JsonObject'
    HubConnection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        system_type:
          $ref: '#/components/schemas/HubTransportType'
        system_name:
          type: [string, 'null']
        system_version:
          type: [string, 'null']
        country_code:
          type: [string, 'null']
        country_name:
          type: [string, 'null']
        organization:
          type: [string, 'null']
        base_url:
          type: [string, 'null']
        auth_type:
          $ref: '#/components/schemas/HubAuthType'
        credentials:
          $ref: '#/components/schemas/MaskedCredentials'
        headers:
          type: object
          additionalProperties:
            type: string
        tls_config:
          type: [object, 'null']
        direction:
          $ref: '#/components/schemas/HubDirection'
        domains:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/HubConnectionStatus'
        last_health_at:
          type: [string, 'null']
          format: date-time
        last_health_ok:
          type: boolean
        health_message:
          type: [string, 'null']
        focal_technical:
          oneOf:
            - $ref: '#/components/schemas/FocalPoint'
            - type: 'null'
        focal_data_owner:
          oneOf:
            - $ref: '#/components/schemas/FocalPoint'
            - type: 'null'
        total_transactions:
          type: integer
        total_records:
          type: integer
        total_errors:
          type: integer
        last_transaction_at:
          type: [string, 'null']
          format: date-time
        notes:
          type: [string, 'null']
        config:
          $ref: '#/components/schemas/JsonObject'
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HubConnectionDetail:
      allOf:
        - $ref: '#/components/schemas/HubConnection'
        - type: object
          properties:
            pipelines:
              type: array
              items:
                $ref: '#/components/schemas/HubPipeline'
            schedules:
              type: array
              items:
                $ref: '#/components/schemas/HubSchedule'
            _count:
              type: object
              properties:
                transactions: { type: integer }
                referential_mappings: { type: integer }
                field_mappings: { type: integer }
    HealthCheckResult:
      type: object
      properties:
        connection_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [UP, DOWN]
        response_time_ms:
          type: [integer, 'null']
        status_code:
          type: [integer, 'null']
        message:
          type: string
        checked_at:
          type: string
          format: date-time

    # ───────── Mappings ─────────
    ReferentialMappingItem:
      type: object
      required: [source_code, target_code]
      properties:
        source_code:
          type: string
          maxLength: 100
          description: Code used by the partner system.
        source_label:
          type: string
          maxLength: 255
        target_code:
          type: string
          maxLength: 100
          description: ARIS master-data code (see Reference data).
        target_label:
          type: string
          maxLength: 255
        target_id:
          type: string
          format: uuid
          description: ARIS entity UUID (optional).
        is_verified:
          type: boolean
        notes:
          type: string
    ReferentialMappingCreate:
      allOf:
        - type: object
          required: [referential_type]
          properties:
            referential_type:
              $ref: '#/components/schemas/HubReferentialType'
            direction:
              $ref: '#/components/schemas/HubDirection'
        - $ref: '#/components/schemas/ReferentialMappingItem'
    ReferentialMappingUpdate:
      type: object
      properties:
        source_code: { type: string }
        source_label: { type: string }
        target_code: { type: string }
        target_label: { type: string }
        target_id: { type: string, format: uuid }
        is_verified: { type: boolean }
        is_active: { type: boolean }
        notes: { type: string }
    ReferentialMappingBulk:
      type: object
      required: [referential_type, mappings]
      properties:
        referential_type:
          $ref: '#/components/schemas/HubReferentialType'
        direction:
          $ref: '#/components/schemas/HubDirection'
        mappings:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: '#/components/schemas/ReferentialMappingItem'
    ReferentialMapping:
      type: object
      properties:
        id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        referential_type:
          $ref: '#/components/schemas/HubReferentialType'
        direction:
          $ref: '#/components/schemas/HubDirection'
        source_code:
          type: string
        source_label:
          type: [string, 'null']
        target_code:
          type: string
        target_label:
          type: [string, 'null']
        target_id:
          type: [string, 'null']
          format: uuid
        is_verified:
          type: boolean
        is_active:
          type: boolean
        notes:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 1d3f5b7c-9e1a-4c3e-8b5d-7f9a1c3e5b7d
        connection_id: 3f1c2a9e-5b7d-4e8a-9c21-6d0f4b8a7e11
        referential_type: DISEASE
        direction: INBOUND
        source_code: FMD-KE
        source_label: Foot and Mouth Disease
        target_code: FMD
        target_label: Foot and mouth disease
        target_id: null
        is_verified: true
        is_active: true
        notes: null
        created_at: '2026-11-04T12:00:00.000Z'
        updated_at: '2026-11-04T12:00:00.000Z'
    ImportResult:
      type: object
      properties:
        imported: { type: integer }
        skipped: { type: integer }
        total: { type: integer }
    FieldMappingItem:
      type: object
      required: [source_field, target_field]
      properties:
        source_field:
          type: string
          maxLength: 255
          description: Source path (dot notation).
        target_field:
          type: string
          maxLength: 255
          description: Target path (dot notation).
        transformation:
          type: string
          description: Optional JSONata expression evaluated on the source record.
        default_value:
          type: string
        is_required:
          type: boolean
        notes:
          type: string
    FieldMappingCreate:
      allOf:
        - type: object
          required: [entity_type, direction]
          properties:
            entity_type:
              type: string
              example: health_events
            direction:
              $ref: '#/components/schemas/HubDirection'
        - $ref: '#/components/schemas/FieldMappingItem'
    FieldMappingUpdate:
      type: object
      properties:
        source_field: { type: string }
        target_field: { type: string }
        transformation: { type: string }
        default_value: { type: string }
        is_required: { type: boolean }
        is_active: { type: boolean }
        notes: { type: string }
    FieldMappingBulk:
      type: object
      required: [entity_type, direction, mappings]
      properties:
        entity_type:
          type: string
        direction:
          $ref: '#/components/schemas/HubDirection'
        mappings:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldMappingItem'
    FieldMapping:
      type: object
      properties:
        id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        entity_type:
          type: string
        direction:
          $ref: '#/components/schemas/HubDirection'
        source_field:
          type: string
        target_field:
          type: string
        transformation:
          type: [string, 'null']
        default_value:
          type: [string, 'null']
        is_required:
          type: boolean
        is_active:
          type: boolean
        notes:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ───────── Pipelines ─────────
    StepConfig:
      type: object
      additionalProperties: true
      description: |
        Step-specific configuration:
        * `RECEIVE`: `records_path`, `max_batch_size`, `content_type`
        * `REFERENTIAL_MAP`: `referential_types[]`, `strict`
        * `FIELD_TRANSFORM`: `entity_type`, `inline_expression` (JSONata)
        * `SCHEMA_VALIDATE`: `json_schema`, `strict`
        * `QUALITY_GATE`: `rules[]`, `min_score`
        * `ENRICH`: `sources[]` (`species`, `diseases`, `geo`, `units`)
        * `FORMAT_BUILD`: `format` (HubExportFormat), `template`, `options`
        * `ROUTE`: `campaign_id`, `form_id`
        * `NOTIFY`: `channels[]` (`in_app`, `email`, `sms`, `push`), `title_template`, `message_template`
        * `DELIVER`: `url`, `method`, `headers`, `max_retries`, `retry_delay_ms`
    HubPipelineStepInput:
      type: object
      required: [step_order, step_type, name]
      properties:
        step_order:
          type: integer
          minimum: 1
        step_type:
          $ref: '#/components/schemas/HubStepType'
        name:
          type: string
        description:
          type: string
        is_enabled:
          type: boolean
          default: true
        config:
          $ref: '#/components/schemas/StepConfig'
        on_error:
          $ref: '#/components/schemas/HubStepOnError'
        timeout_ms:
          type: integer
          default: 30000
          description: |
            Step timeout. For `ROUTE` the effective timeout is
            `max(timeout_ms, 10 s + ceil(records / 5) × 1.5 s)`, since it loads up to 5
            records in parallel; no manual increase is needed for large batches.
    HubPipelineStep:
      allOf:
        - $ref: '#/components/schemas/HubPipelineStepInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            pipeline_id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    HubPipelineSettings:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        sub_domain:
          type: string
          example: outbreaks
        entity_type:
          type: string
          example: health_events
        mode:
          $ref: '#/components/schemas/HubPipelineMode'
        target_campaign_id:
          type: string
          format: uuid
          description: ARIS campaign receiving inbound submissions.
        target_form_id:
          type: string
          format: uuid
        target_workflow_id:
          type: string
          format: uuid
        export_format:
          $ref: '#/components/schemas/HubExportFormat'
        quality_gates_enabled:
          type: boolean
          default: true
        min_quality_score:
          type: number
          minimum: 0
          maximum: 1
          default: 0.7
        reject_on_quality_fail:
          type: boolean
          default: false
        max_retries:
          type: integer
          default: 3
        retry_delay_ms:
          type: integer
          default: 60000
        dlq_enabled:
          type: boolean
          default: true
    HubPipelineCreate:
      allOf:
        - type: object
          required: [connection_id, name, direction, domain]
          properties:
            connection_id:
              type: string
              format: uuid
            direction:
              $ref: '#/components/schemas/HubDirection'
            domain:
              type: string
              example: animal-health
            steps:
              type: array
              items:
                $ref: '#/components/schemas/HubPipelineStepInput'
        - $ref: '#/components/schemas/HubPipelineSettings'
    HubPipelineUpdate:
      allOf:
        - $ref: '#/components/schemas/HubPipelineSettings'
        - type: object
          properties:
            status:
              $ref: '#/components/schemas/HubPipelineStatus'
    HubPipeline:
      type: object
      properties:
        id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        direction:
          $ref: '#/components/schemas/HubDirection'
        domain:
          type: string
        sub_domain:
          type: [string, 'null']
        entity_type:
          type: [string, 'null']
        mode:
          $ref: '#/components/schemas/HubPipelineMode'
        status:
          $ref: '#/components/schemas/HubPipelineStatus'
        target_campaign_id:
          type: [string, 'null']
          format: uuid
        target_form_id:
          type: [string, 'null']
          format: uuid
        target_workflow_id:
          type: [string, 'null']
          format: uuid
        export_format:
          oneOf:
            - $ref: '#/components/schemas/HubExportFormat'
            - type: 'null'
        quality_gates_enabled:
          type: boolean
        min_quality_score:
          type: [number, 'null']
        reject_on_quality_fail:
          type: boolean
        max_retries:
          type: integer
        retry_delay_ms:
          type: integer
        dlq_enabled:
          type: boolean
        total_runs:
          type: integer
        successful_runs:
          type: integer
        failed_runs:
          type: integer
        last_run_at:
          type: [string, 'null']
          format: date-time
        last_run_status:
          type: [string, 'null']
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        steps:
          type: array
          description: Included on create, detail, update and step replacement.
          items:
            $ref: '#/components/schemas/HubPipelineStep'
        connection:
          $ref: '#/components/schemas/ConnectionSummary'
    PipelineExecuteRequest:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/Record'
        payload:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/Record'
            - $ref: '#/components/schemas/Record'

    # ───────── Schedules ─────────
    HubScheduleCreate:
      type: object
      required: [connection_id, frequency]
      properties:
        connection_id:
          type: string
          format: uuid
        pipeline_id:
          type: string
          format: uuid
          description: Omit to apply to all active pipelines of the connection.
        frequency:
          $ref: '#/components/schemas/HubScheduleFrequency'
        cron_expression:
          type: string
          description: Custom cron (overrides `frequency`).
        timezone:
          type: string
          default: UTC
        window_start:
          type: string
          example: '02:00'
        window_end:
          type: string
          example: '04:00'
        period_type:
          type: string
          description: e.g. `previous_week`, `previous_month`, `previous_quarter`, `custom`.
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
    HubScheduleUpdate:
      type: object
      properties:
        pipeline_id: { type: string, format: uuid }
        frequency:
          $ref: '#/components/schemas/HubScheduleFrequency'
        cron_expression: { type: string }
        timezone: { type: string }
        window_start: { type: string }
        window_end: { type: string }
        period_type: { type: string }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
    HubSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        pipeline_id:
          type: [string, 'null']
          format: uuid
        tenant_id:
          type: string
          format: uuid
        frequency:
          $ref: '#/components/schemas/HubScheduleFrequency'
        cron_expression:
          type: [string, 'null']
        timezone:
          type: string
        window_start:
          type: [string, 'null']
        window_end:
          type: [string, 'null']
        period_type:
          type: [string, 'null']
        period_start:
          type: [string, 'null']
          format: date-time
        period_end:
          type: [string, 'null']
          format: date-time
        is_active:
          type: boolean
        last_run_at:
          type: [string, 'null']
          format: date-time
        next_run_at:
          type: [string, 'null']
          format: date-time
        last_run_ok:
          type: [boolean, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        connection:
          $ref: '#/components/schemas/ConnectionSummary'

    # ───────── Agreements ─────────
    HubAgreementFields:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        purpose:
          type: string
        legal_basis:
          type: string
        partner_tenant_id:
          type: string
          format: uuid
        partner_name:
          type: string
          example: Directorate of Veterinary Services, Kenya
        domains:
          type: array
          items:
            type: string
        direction:
          $ref: '#/components/schemas/HubDirection'
        data_scope:
          type: object
          additionalProperties: true
          description: Free-form scope, e.g. `{ entities[], fields{}, filters{}, geoFilter{}, timeRange{} }`.
        data_classification:
          $ref: '#/components/schemas/DataClassification'
        frequency:
          $ref: '#/components/schemas/HubScheduleFrequency'
        timeliness_sla_hours:
          type: integer
          description: Maximum hours from event to delivery.
        quality_min_score:
          type: number
          minimum: 0
          maximum: 1
        valid_from:
          type: string
          format: date
        valid_until:
          type: string
          format: date
    HubAgreementCreate:
      allOf:
        - type: object
          required: [connection_id, title, partner_name, direction]
          properties:
            connection_id:
              type: string
              format: uuid
        - $ref: '#/components/schemas/HubAgreementFields'
    HubAgreementUpdate:
      $ref: '#/components/schemas/HubAgreementFields'
    HubAgreement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        connection_id:
          type: string
          format: uuid
        reference:
          type: string
          example: HUB-2026-00042
        tenant_id:
          type: string
          format: uuid
        owner_tenant_id:
          type: string
          format: uuid
        owner_name:
          type: string
        partner_tenant_id:
          type: [string, 'null']
          format: uuid
        partner_name:
          type: string
        title:
          type: string
        description:
          type: [string, 'null']
        purpose:
          type: [string, 'null']
        legal_basis:
          type: [string, 'null']
        domains:
          type: array
          items:
            type: string
        direction:
          $ref: '#/components/schemas/HubDirection'
        data_scope:
          type: [object, 'null']
        data_classification:
          type: [string, 'null']
          enum: [PUBLIC, PARTNER, RESTRICTED, CONFIDENTIAL, null]
        frequency:
          oneOf:
            - $ref: '#/components/schemas/HubScheduleFrequency'
            - type: 'null'
        timeliness_sla_hours:
          type: [integer, 'null']
        quality_min_score:
          type: [number, 'null']
        status:
          $ref: '#/components/schemas/HubAgreementStatus'
        proposed_at:
          type: [string, 'null']
          format: date-time
        reviewed_at:
          type: [string, 'null']
          format: date-time
        accepted_at:
          type: [string, 'null']
          format: date-time
        rejected_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        valid_from:
          type: [string, 'null']
          format: date-time
        valid_until:
          type: [string, 'null']
          format: date-time
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        connection:
          $ref: '#/components/schemas/ConnectionSummary'

    # ───────── Monitoring ─────────
    DashboardOverview:
      type: object
      properties:
        active_connections: { type: integer }
        total_connections: { type: integer }
        active_pipelines: { type: integer }
        transactions_today: { type: integer }
        failed_today: { type: integer }
        pending_review: { type: integer }
        error_rate:
          type: number
          description: Percentage of today's transactions that failed.
    VolumePoint:
      type: object
      properties:
        period:
          type: string
          format: date-time
        inbound: { type: integer }
        outbound: { type: integer }
        total: { type: integer }
    ConnectionStats:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country_code: { type: [string, 'null'] }
        system_type:
          $ref: '#/components/schemas/HubTransportType'
        direction:
          $ref: '#/components/schemas/HubDirection'
        status:
          $ref: '#/components/schemas/HubConnectionStatus'
        last_health_ok: { type: boolean }
        last_health_at: { type: [string, 'null'], format: date-time }
        total_transactions: { type: integer }
        total_records: { type: integer }
        total_errors: { type: integer }
        last_transaction_at: { type: [string, 'null'], format: date-time }
        success_rate:
          type: [number, 'null']
          description: Percentage of COMPLETED transactions.
        avg_latency_ms: { type: [integer, 'null'] }
    DomainStats:
      type: object
      properties:
        domain: { type: string }
        inbound: { type: integer }
        outbound: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
        total: { type: integer }
    ConnectionHealth:
      type: object
      properties:
        connection_id: { type: string, format: uuid }
        name: { type: string }
        country_code: { type: [string, 'null'] }
        system_type:
          $ref: '#/components/schemas/HubTransportType'
        base_url: { type: [string, 'null'] }
        status:
          type: string
          enum: [UP, DOWN, UNKNOWN]
        last_checked: { type: [string, 'null'], format: date-time }
        message: { type: [string, 'null'] }
    RecentTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        direction:
          $ref: '#/components/schemas/HubDirection'
        status:
          $ref: '#/components/schemas/HubTransactionStatus'
        domain: { type: string }
        entity_type: { type: [string, 'null'] }
        country_code: { type: [string, 'null'] }
        records_total: { type: integer }
        records_accepted: { type: integer }
        records_rejected: { type: integer }
        duration_ms: { type: [integer, 'null'] }
        created_at: { type: string, format: date-time }
        connection:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
    ErrorTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        direction:
          $ref: '#/components/schemas/HubDirection'
        status:
          $ref: '#/components/schemas/HubTransactionStatus'
        domain: { type: string }
        entity_type: { type: [string, 'null'] }
        country_code: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
        current_step: { type: [string, 'null'] }
        retry_count: { type: integer }
        max_retries: { type: integer }
        created_at: { type: string, format: date-time }
        connection:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        pipeline:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
    HubAuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        entity_type: { type: string, example: transaction }
        entity_id: { type: string, format: uuid }
        action: { type: string, example: APPROVE }
        actor_id: { type: string, format: uuid }
        actor_role: { type: string, example: INTEROP_MANAGER }
        details:
          $ref: '#/components/schemas/JsonObject'
        ip_address: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    # ───────── Direct exports ─────────
    ConnectorType:
      type: string
      enum: [WAHIS, EMPRES, FAOSTAT, FISHSTATJ, CITES]
    InteropStatus:
      type: string
      enum: [PENDING, IN_PROGRESS, COMPLETED, FAILED]
    ExportFormat:
      type: string
      enum: [WOAH_JSON, WOAH_XML, EMPRES_JSON, FAOSTAT_CSV, FAOSTAT_JSON, FISHSTATJ_CSV, CITES_CSV]
    WahisExportRequest:
      type: object
      required: [countryCode, periodStart, periodEnd]
      properties:
        countryCode:
          type: string
          example: KE
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        format:
          type: string
          enum: [WOAH_JSON, WOAH_XML]
          default: WOAH_JSON
    WahisQuarterExportRequest:
      type: object
      required: [countryIso, year, quarter]
      properties:
        countryIso:
          type: string
          example: KE
        year:
          type: integer
          example: 2026
        quarter:
          type: integer
          enum: [1, 2, 3, 4]
        diseases:
          type: array
          items:
            type: string
          description: ARIS disease codes to include (all if omitted).
    EmpresFeedRequest:
      type: object
      required: [healthEventId, diseaseCode, countryCode, confidenceLevel, context]
      properties:
        healthEventId:
          type: string
          format: uuid
        diseaseCode:
          type: string
        countryCode:
          type: string
        confidenceLevel:
          type: string
          description: e.g. RUMOR, VERIFIED, CONFIRMED.
        context:
          type: string
        coordinates:
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }
        species:
          type: array
          items:
            type: string
        cases:
          type: integer
        deaths:
          type: integer
    EmpresExportRequest:
      type: object
      required: [countryIso]
      properties:
        countryIso:
          type: string
        dateFrom:
          type: string
          format: date
          description: Default 90 days ago.
        dateTo:
          type: string
          format: date
          description: Default today.
        diseaseFilter:
          type: array
          items:
            type: string
    FaostatSyncRequest:
      type: object
      required: [countryCode, year, records]
      properties:
        countryCode:
          type: string
        year:
          type: integer
        sourceUrl:
          type: string
        records:
          type: array
          items:
            type: object
            required: [countryCode, speciesCode, year, population]
            properties:
              countryCode: { type: string }
              speciesCode: { type: string }
              year: { type: integer }
              population: { type: number }
              source: { type: string }
    FaostatExportRequest:
      type: object
      required: [indicatorCode, countryIso, yearRange]
      properties:
        indicatorCode:
          type: string
          enum: [QCL, QL, TM]
        countryIso:
          type: array
          items:
            type: string
        yearRange:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
          description: '[startYear, endYear]'
    ExportRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        connectorType:
          $ref: '#/components/schemas/ConnectorType'
        countryCode:
          type: string
          description: Comma-separated list for multi-country FAOSTAT exports.
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        format:
          $ref: '#/components/schemas/ExportFormat'
        status:
          $ref: '#/components/schemas/InteropStatus'
        recordCount: { type: integer }
        packageUrl:
          type: [string, 'null']
          description: Download URL of the package (pre-signed, valid 1 hour when generated).
        packageSize: { type: [integer, 'null'] }
        errorMessage: { type: [string, 'null'] }
        exportedBy: { type: string, format: uuid }
        exportedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeedRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        connectorType:
          $ref: '#/components/schemas/ConnectorType'
        healthEventId: { type: string, format: uuid }
        diseaseId: { type: [string, 'null'] }
        countryCode: { type: string }
        confidenceLevel: { type: string }
        status:
          $ref: '#/components/schemas/InteropStatus'
        payload:
          $ref: '#/components/schemas/JsonObject'
        responseCode: { type: [integer, 'null'] }
        responseBody: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        fedBy: { type: string, format: uuid }
        fedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SyncRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        connectorType:
          $ref: '#/components/schemas/ConnectorType'
        countryCode: { type: string }
        year: { type: integer }
        status:
          $ref: '#/components/schemas/InteropStatus'
        recordsImported: { type: integer }
        recordsUpdated: { type: integer }
        discrepancies: { type: integer }
        discrepancyDetails: {}
        sourceUrl: { type: [string, 'null'] }
        syncedBy: { type: string, format: uuid }
        syncedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConnectorConfig:
      type: object
      properties:
        id: { type: string, format: uuid }
        connectorType:
          $ref: '#/components/schemas/ConnectorType'
        name: { type: string }
        description: { type: [string, 'null'] }
        baseUrl: { type: string }
        isActive: { type: boolean }
        lastHealthCheck: { type: [string, 'null'], format: date-time }
        lastHealthStatus: { type: [string, 'null'] }
        config: {}
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConnectorHealthStatus:
      type: object
      properties:
        connectorType:
          $ref: '#/components/schemas/ConnectorType'
        name: { type: string }
        isActive: { type: boolean }
        status:
          type: string
          enum: [UP, DOWN, DEGRADED, UNKNOWN]
        lastChecked: { type: [string, 'null'], format: date-time }
        baseUrl: { type: string }

    # ───────── Reference data ─────────
    LocalizedName:
      type: object
      properties:
        en: { type: string }
        fr: { type: string }
        pt: { type: string }
        ar: { type: string }
    GeoLevel:
      type: string
      enum: [COUNTRY, ADMIN1, ADMIN2, ADMIN3, ADMIN4, ADMIN5, SPECIAL_ZONE]
    GeoEntity:
      type: object
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          example: KE-01
        name:
          $ref: '#/components/schemas/LocalizedName'
        nameEn: { type: string }
        nameFr: { type: string }
        namePt: { type: string }
        nameAr: { type: string }
        level:
          $ref: '#/components/schemas/GeoLevel'
        parentId: { type: [string, 'null'], format: uuid }
        parentName:
          $ref: '#/components/schemas/LocalizedName'
        countryCode:
          type: string
          example: KE
        centroidLat: { type: [number, 'null'] }
        centroidLng: { type: [number, 'null'] }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        isActive: { type: boolean }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SpeciesCategory:
      type: string
      enum: [DOMESTIC, WILDLIFE, AQUATIC, APICULTURE]
    Species:
      type: object
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          example: BOS-TAU
        scientificName: { type: string }
        commonNameEn: { type: string }
        commonNameFr: { type: string }
        commonNamePt: { type: string }
        commonNameAr: { type: string }
        category:
          $ref: '#/components/schemas/SpeciesCategory'
        productionCategories:
          type: array
          items:
            type: string
        isWoahListed: { type: boolean }
        faoAlphaCode: { type: [string, 'null'] }
        speciesGroup: { type: [string, 'null'] }
        habitatType: { type: [string, 'null'] }
        isActive: { type: boolean }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Disease:
      type: object
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          example: FMD
        nameEn: { type: string }
        nameFr: { type: string }
        namePt: { type: string }
        nameAr: { type: string }
        isWoahListed: { type: boolean }
        affectedSpecies:
          type: array
          items:
            type: string
          description: ARIS species codes.
        isNotifiable: { type: boolean }
        wahisCategory: { type: [string, 'null'] }
        isActive: { type: boolean }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UnitCategory:
      type: string
      enum: [COUNT, WEIGHT, VOLUME, AREA, LENGTH, DOSE, CURRENCY, PROPORTION, TIME]
    Unit:
      type: object
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          example: HEAD
        nameEn: { type: string }
        nameFr: { type: string }
        namePt: { type: string }
        nameAr: { type: string }
        symbol: { type: string, example: head }
        category:
          $ref: '#/components/schemas/UnitCategory'
        siConversion: { type: [number, 'null'] }
        isActive: { type: boolean }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
