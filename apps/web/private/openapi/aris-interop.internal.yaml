  # ═══════════════════════════ CONNECTIONS ═══════════════════════════
  /api/v1/hub/connections:
    post:
      tags: [Connections]
      operationId: createConnection
      summary: Create a connection
      description: |
        Registers a partner system for the caller's tenant. New connections start in
        `DRAFT`; activate them with `POST /connections/{id}/activate`.

        For an **inbound API push** connection set `direction: INBOUND`,
        `auth_type: API_KEY` and `credentials.apiKey` (or `BEARER_TOKEN` with
        `credentials.token`). For a **webhook** connection set
        `credentials.webhookSecret`. For **outbound delivery**, `base_url` is the
        partner endpoint and credentials are used as follows: `BEARER_TOKEN` →
        `credentials.token`; `API_KEY` → header `credentials.header_name` with value
        `credentials.api_key`; `BASIC` → `credentials.username`/`password`.

        **Secrets are write-only.** In every response, each value of `credentials`
        is replaced by `"********"` (keys are kept so you can see what is configured;
        empty or null values stay empty/null).

        Connection names are unique per tenant (a duplicate currently fails with a
        `500` error).

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubConnectionCreate'
            example:
              name: Kenya KLHIS
              description: Kenya Livestock and Health Information System — outbreak reports
              system_type: REST_API
              system_name: KLHIS
              system_version: '3.2'
              country_code: KE
              country_name: Kenya
              organization: Directorate of Veterinary Services, Kenya
              auth_type: API_KEY
              credentials:
                apiKey: ke-klhis-7f3a9c2e4b6d8f10
                webhookSecret: whsec_2b9f4e7a1c3d5e6f
              direction: INBOUND
              domains: [animal-health]
              focal_technical:
                name: Jane Wanjiru
                email: j.wanjiru@kilimo.go.ke
                role: KLHIS system administrator
              focal_data_owner:
                name: Dr. Peter Otieno
                email: cvo@kilimo.go.ke
                role: Chief Veterinary Officer
      responses:
        '201':
          description: Connection created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HubConnection'
        '400':
          description: Missing `name`, `system_type`, `direction` or `domains[]`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 400
                message: name, system_type, direction, and domains[] are required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Connections]
      operationId: listConnections
      summary: List connections
      description: |
        Lists connections of the caller's tenant, newest first.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`, `REC_ADMIN`, `NATIONAL_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/HubLimit'
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/HubDirection'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/HubConnectionStatus'
        - name: country_code
          in: query
          schema:
            type: string
          example: KE
        - name: system_type
          in: query
          schema:
            $ref: '#/components/schemas/HubTransportType'
      responses:
        '200':
          description: Page of connections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HubConnection'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/hub/connections/{id}:
    get:
      tags: [Connections]
      operationId: getConnection
      summary: Get a connection
      description: |
        Returns a connection with its pipelines, schedules and counts of
        transactions and mappings.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`, `REC_ADMIN`, `NATIONAL_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Connection detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HubConnectionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Connections]
      operationId: updateConnection
      summary: Update a connection
      description: |
        Partially updates a connection. `id`, `tenant_id`, `created_by` and
        `created_at` are ignored. Only send fields of the connection model; unknown
        fields currently cause a `500` error.

        **Credentials** are merged key by key with the stored ones:
        * a key sent with the mask value `"********"` keeps its stored secret (so a
          connection read with GET can be sent back unchanged);
        * a key sent with any other value replaces the stored secret (rotation);
        * keys not sent are kept.

        The response returns `credentials` masked.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubConnectionUpdate'
            example:
              base_url: https://klhis.kilimo.go.ke/api/v2
              credentials:
                apiKey: ke-klhis-rotated-91ab33c0
                webhookSecret: '********'
      responses:
        '200':
          description: Updated connection.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HubConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Connections]
      operationId: deleteConnection
      summary: Delete a connection
      description: |
        Deletes a connection that is still in `DRAFT`. Other connections must be
        suspended instead.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted.
        '400':
          description: Connection is not in DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 400
                message: Only DRAFT connections can be deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/connections/{id}/activate:
    post:
      tags: [Connections]
      operationId: activateConnection
      summary: Activate a connection
      description: |
        Sets the status to `ACTIVE`. Only active inbound connections accept push and
        webhook calls. If already active, the connection is returned with a message.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/ConnectionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/connections/{id}/suspend:
    post:
      tags: [Connections]
      operationId: suspendConnection
      summary: Suspend a connection
      description: |
        Sets the status to `SUSPENDED`. Push and webhook calls for the connection are
        then refused (`401` / `404`).

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/ConnectionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/connections/{id}/test:
    post:
      tags: [Connections]
      operationId: testConnection
      summary: Test connectivity
      description: |
        Sends an unauthenticated `GET` to the connection's `base_url` (10 s timeout),
        records the result and updates `last_health_at`, `last_health_ok` and
        `health_message`. Without a `base_url` the result is `DOWN` with
        "No base_url configured".

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Health-check result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HealthCheckResult'
              example:
                data:
                  connection_id: 3f1c2a9e-5b7d-4e8a-9c21-6d0f4b8a7e11
                  status: UP
                  response_time_ms: 182
                  status_code: 200
                  message: Connection successful
                  checked_at: '2026-11-06T09:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════ MAPPINGS ═══════════════════════════
  /api/v1/hub/connections/{connectionId}/referential-mappings:
    parameters:
      - $ref: '#/components/parameters/ConnectionIdPath'
    post:
      tags: [Mappings]
      operationId: createReferentialMapping
      summary: Create a code mapping
      description: |
        Maps one partner code to an ARIS code for a referential type. During the
        `REFERENTIAL_MAP` step, string values in well-known fields are replaced:

        | Type | Fields inspected |
        |---|---|
        | `DISEASE` | `disease_code`, `disease`, `diseaseCode`, `disease_id` |
        | `SPECIES` | `species_code`, `species`, `speciesCode`, `species_id` |
        | `GEO_ADMIN` | `admin_code`, `admin1_code`, `admin2_code`, `admin3_code`, `district_code`, `region_code` |
        | `GEO_COUNTRY` | `country_code`, `country`, `countryCode` |
        | `UNIT` | `unit_code`, `unit`, `unitCode` |
        | `LAB`, `COMMODITY`, `MARKET`, `VACCINE`, `BREED` | `<type>_code`, `<type>` |
        | `AGE_GROUP` | `age_group_code`, `age_group`, `ageGroup` |
        | `PRODUCTION_SYSTEM` | `production_system_code`, `production_system` |

        When `target_id`/`target_label` are set, `<field>_id`/`<field>_name` are added
        too (e.g. `disease_id`, `disease_name`). Only exact, string matches are
        mapped; numeric codes should be sent as strings. A code already mapped for the
        same type and direction cannot be created twice (use bulk, which upserts).

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferentialMappingCreate'
            example:
              referential_type: DISEASE
              direction: INBOUND
              source_code: FMD-KE
              source_label: Foot and Mouth Disease
              target_code: FMD
              target_label: Foot and mouth disease
              is_verified: true
      responses:
        '201':
          description: Mapping created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReferentialMapping'
        '400':
          description: Missing `referential_type`, `source_code` or `target_code`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Mappings]
      operationId: listReferentialMappings
      summary: List code mappings
      description: |
        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`, `REC_ADMIN`, `NATIONAL_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/HubLimit'
        - name: referential_type
          in: query
          schema:
            $ref: '#/components/schemas/HubReferentialType'
      responses:
        '200':
          description: Page of mappings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReferentialMapping'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/connections/{connectionId}/referential-mappings/{mappingId}:
    parameters:
      - $ref: '#/components/parameters/ConnectionIdPath'
      - $ref: '#/components/parameters/MappingIdPath'
    patch:
      tags: [Mappings]
      operationId: updateReferentialMapping
      summary: Update a code mapping
      description: |
        Partially updates a mapping (`id`, `connection_id`, `created_at` ignored).
        Set `is_active: false` to disable it without deleting.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferentialMappingUpdate'
            example:
              target_code: FMD
              is_verified: true
      responses:
        '200':
          description: Updated mapping.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReferentialMapping'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Mappings]
      operationId: deleteReferentialMapping
      summary: Delete a code mapping
      description: '**Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/connections/{connectionId}/referential-mappings/bulk:
    parameters:
      - $ref: '#/components/parameters/ConnectionIdPath'
    post:
      tags: [Mappings]
      operationId: bulkUpsertReferentialMappings
      summary: Bulk upsert code mappings
      description: |
        Creates or updates (by `source_code`, for the given `referential_type` and
        `direction`) up to 5,000 mappings in one atomic operation.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferentialMappingBulk'
            example:
              referential_type: SPECIES
              direction: INBOUND
              mappings:
                - source_code: CTL
                  source_label: Cattle
                  target_code: BOS-TAU
                  target_label: Cattle (taurine)
                - source_code: ZEB
                  source_label: Zebu cattle
                  target_code: BOS-IND
                  target_label: Cattle (zebu)
                - source_code: GT
                  source_label: Goats
                  target_code: CAP-HIR
      responses:
        '201':
          description: Upserted mappings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReferentialMapping'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
        '400':
          description: Missing type, empty list or more than 5,000 mappings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 400
                message: Maximum 5,000 mappings per bulk request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/connections/{connectionId}/referential-mappings/import:
    parameters:
      - $ref: '#/components/parameters/ConnectionIdPath'
    post:
      tags: [Mappings]
      operationId: importReferentialMappings
      summary: Import code mappings from a file or JSON
      description: |
        Upserts INBOUND mappings from:

        * **multipart/form-data** — field `referential_type` (sent **before** the
          file part) and a `file`:
          * `.json`: an array of mappings, or `{ "mappings": [ … ] }`;
          * `.csv`: comma-separated header with `source_code` (or `source`),
            `target_code` (or `target`), optional `source_label`/`source_name`,
            `target_label`/`target_name`, `target_id`. The CSV reader is simple:
            no quoted fields, no `;` separator, no commas inside values.
        * **application/json** — `{ "referential_type": …, "mappings": [ … ] }`.

        Rows without `source_code` or `target_code` are skipped. Imported mappings are
        marked `is_verified: false`.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [referential_type, file]
              properties:
                referential_type:
                  $ref: '#/components/schemas/HubReferentialType'
                file:
                  type: string
                  format: binary
                  description: '.csv or .json file.'
          application/json:
            schema:
              type: object
              required: [referential_type, mappings]
              properties:
                referential_type:
                  $ref: '#/components/schemas/HubReferentialType'
                mappings:
                  type: array
                  items:
                    $ref: '#/components/schemas/ReferentialMappingItem'
            example:
              referential_type: GEO_ADMIN
              mappings:
                - source_code: '001'
                  source_label: Mombasa County
                  target_code: KE-01
                - source_code: '002'
                  source_label: Kwale County
                  target_code: KE-02
      responses:
        '201':
          description: Import summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ImportResult'
              example:
                data:
                  imported: 47
                  skipped: 0
                  total: 47
        '400':
          description: Missing type, no mappings, unsupported file type or invalid file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/connections/{connectionId}/field-mappings:
    parameters:
      - $ref: '#/components/parameters/ConnectionIdPath'
    post:
      tags: [Mappings]
      operationId: createFieldMapping
      summary: Create a field mapping
      description: |
        Maps a source field (dot notation) to a target field for an `entity_type` and
        direction. When the `FIELD_TRANSFORM` step uses field mappings, the output
        record contains **only** the mapped target fields. `transformation` is an
        optional JSONata expression evaluated against the whole source record;
        `default_value` is used when the result is null/undefined.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldMappingCreate'
            example:
              entity_type: health_events
              direction: INBOUND
              source_field: report_date
              target_field: reportDate
              is_required: true
      responses:
        '201':
          description: Field mapping created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FieldMapping'
        '400':
          description: Missing `entity_type`, `direction`, `source_field` or `target_field`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Mappings]
      operationId: listFieldMappings
      summary: List field mappings
      description: '**Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`, `REC_ADMIN`, `NATIONAL_ADMIN`.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/HubLimit'
        - name: entity_type
          in: query
          schema:
            type: string
          example: health_events
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/HubDirection'
      responses:
        '200':
          description: Page of field mappings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FieldMapping'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/connections/{connectionId}/field-mappings/{mappingId}:
    parameters:
      - $ref: '#/components/parameters/ConnectionIdPath'
      - $ref: '#/components/parameters/MappingIdPath'
    patch:
      tags: [Mappings]
      operationId: updateFieldMapping
      summary: Update a field mapping
      description: '**Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldMappingUpdate'
            example:
              transformation: "$number(cases)"
      responses:
        '200':
          description: Updated field mapping.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FieldMapping'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Mappings]
      operationId: deleteFieldMapping
      summary: Delete a field mapping
      description: '**Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/connections/{connectionId}/field-mappings/bulk:
    parameters:
      - $ref: '#/components/parameters/ConnectionIdPath'
    post:
      tags: [Mappings]
      operationId: bulkUpsertFieldMappings
      summary: Bulk upsert field mappings
      description: |
        Creates or updates field mappings (keyed by `source_field` + `target_field`)
        for one `entity_type` and direction, atomically.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldMappingBulk'
            example:
              entity_type: health_events
              direction: INBOUND
              mappings:
                - source_field: event_id
                  target_field: externalId
                  is_required: true
                - source_field: disease_code
                  target_field: diseaseCode
                  is_required: true
                - source_field: species_code
                  target_field: speciesCode
                - source_field: admin2_code
                  target_field: admin2Code
                - source_field: cases
                  target_field: cases
                  default_value: '0'
      responses:
        '201':
          description: Upserted field mappings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FieldMapping'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
        '400':
          description: Missing `entity_type`, `direction` or empty `mappings`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════ PIPELINES ═══════════════════════════
  /api/v1/hub/pipelines:
    post:
      tags: [Pipelines]
      operationId: createPipeline
      summary: Create a pipeline
      description: |
        Creates a pipeline (status `DRAFT`, default mode `MANUAL`) for a connection of
        the caller's tenant, optionally with its steps. There can be only one pipeline
        per connection, `domain` and `direction` (a duplicate currently fails with a
        `500` error).

        Inbound pipelines that load data need a `ROUTE` step and a
        `target_campaign_id` (the ARIS data-collection campaign that receives the
        submissions). In `MANUAL` mode add a `NOTIFY` step before `ROUTE`: the
        transaction waits for approval there.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubPipelineCreate'
            example:
              connection_id: 3f1c2a9e-5b7d-4e8a-9c21-6d0f4b8a7e11
              name: Kenya KLHIS → ARIS animal health
              direction: INBOUND
              domain: animal-health
              sub_domain: outbreaks
              entity_type: health_events
              mode: MANUAL
              target_campaign_id: 5d7f9b1c-3e5a-4c7e-9f1b-3d5f7a9c1e3b
              quality_gates_enabled: true
              min_quality_score: 0.7
              steps:
                - { step_order: 1, step_type: RECEIVE, name: Receive, config: { max_batch_size: 10000 } }
                - { step_order: 2, step_type: REFERENTIAL_MAP, name: Map KLHIS codes, config: { referential_types: [DISEASE, SPECIES, GEO_ADMIN] } }
                - { step_order: 3, step_type: QUALITY_GATE, name: Quality gates, on_error: CONTINUE }
                - { step_order: 4, step_type: NOTIFY, name: Notify interop managers, config: { channels: [in_app, email] } }
                - { step_order: 5, step_type: ROUTE, name: Load into campaign }
      responses:
        '201':
          description: Pipeline created (with steps).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HubPipeline'
        '400':
          description: Missing `connection_id`, `name`, `direction` or `domain`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Connection not found in the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Pipelines]
      operationId: listPipelines
      summary: List pipelines
      description: '**Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`, `REC_ADMIN`, `NATIONAL_ADMIN`.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/HubLimit'
        - name: connection_id
          in: query
          schema:
            type: string
            format: uuid
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/HubDirection'
        - name: domain
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/HubPipelineStatus'
      responses:
        '200':
          description: Page of pipelines (with a connection summary, without steps).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HubPipeline'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/hub/pipelines/{id}:
    get:
      tags: [Pipelines]
      operationId: getPipeline
      summary: Get a pipeline
      description: |
        Returns the pipeline with its steps (ordered), a connection summary and the
        transaction count.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`, `REC_ADMIN`, `NATIONAL_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/PipelineResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Pipelines]
      operationId: updatePipeline
      summary: Update a pipeline
      description: |
        Partially updates pipeline settings. `id`, `tenant_id`, `connection_id`,
        `created_by`, `created_at` and `steps` are ignored (use
        `PUT /pipelines/{id}/steps`). Unknown fields currently cause a `500` error.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubPipelineUpdate'
            example:
              mode: AUTOMATIC
              reject_on_quality_fail: true
      responses:
        '200':
          $ref: '#/components/responses/PipelineResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Pipelines]
      operationId: deletePipeline
      summary: Delete a pipeline
      description: |
        Deletes a pipeline that is still in `DRAFT`.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted.
        '400':
          description: Pipeline is not in DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 400
                message: Only DRAFT pipelines can be deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/pipelines/{id}/activate:
    post:
      tags: [Pipelines]
      operationId: activatePipeline
      summary: Activate a pipeline
      description: |
        Sets the status to `ACTIVE`. Only active pipelines process ingested data.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/PipelineResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/pipelines/{id}/pause:
    post:
      tags: [Pipelines]
      operationId: pausePipeline
      summary: Pause a pipeline
      description: |
        Sets the status to `PAUSED`. Push/webhook calls for a connection without
        another active inbound pipeline then fail with `422`.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/PipelineResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/pipelines/{id}/execute:
    post:
      tags: [Pipelines]
      operationId: executePipeline
      summary: Execute a pipeline now
      description: |
        Runs an ACTIVE pipeline **synchronously** on the supplied records (`records`
        array, `payload` array, or a single `payload` object) and returns the
        resulting transaction with records and step log. This does not fetch data
        from the partner system. Request body limit: 50 MiB.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineExecuteRequest'
            example:
              records:
                - event_id: KLHIS-2026-000190
                  disease_code: FMD-KE
                  species_code: CTL
                  admin2_code: KE-01
                  report_date: '2026-11-05'
                  cases: 4
      responses:
        '200':
          description: Pipeline executed; the transaction is returned (check its `status`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HubTransactionDetail'
                  message:
                    type: string
                    example: Pipeline executed (COMPLETED)
        '400':
          description: Pipeline not ACTIVE or without enabled steps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 400
                message: Pipeline must be ACTIVE to execute
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/v1/hub/pipelines/{id}/steps:
    put:
      tags: [Pipelines]
      operationId: replacePipelineSteps
      summary: Replace all steps
      description: |
        Atomically replaces the pipeline's steps. `step_order` must be unique.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                steps:
                  type: array
                  items:
                    $ref: '#/components/schemas/HubPipelineStepInput'
            example:
              steps:
                - { step_order: 1, step_type: RECEIVE, name: Receive }
                - { step_order: 2, step_type: REFERENTIAL_MAP, name: Map codes, config: { strict: false } }
                - { step_order: 3, step_type: FIELD_TRANSFORM, name: Rename fields, config: { entity_type: health_events } }
                - { step_order: 4, step_type: ROUTE, name: Load into campaign }
      responses:
        '200':
          $ref: '#/components/responses/PipelineResult'
        '400':
          description: '`steps[]` missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════ SCHEDULES ═══════════════════════════
  /api/v1/hub/schedules:
    post:
      tags: [Schedules]
      operationId: createSchedule
      summary: Create a schedule
      description: |
        Creates a recurring schedule for a connection (all its active pipelines) or a
        single pipeline. Schedules are created **inactive** (`is_active: false`);
        activate them with `POST /schedules/{id}/activate`.

        > **Current limitation.** Scheduled runs do not yet retrieve data from the
        > partner system (pull adapters are not operational), and schedules created
        > through this endpoint do not get a computed `next_run_at`. Treat schedules
        > as configuration records for now; agree push, webhook or file exchange
        > with the ARIS team for production flows.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubScheduleCreate'
            example:
              connection_id: 3f1c2a9e-5b7d-4e8a-9c21-6d0f4b8a7e11
              pipeline_id: 8b2e4d6f-1a3c-4b5d-9e7f-0a1b2c3d4e5f
              frequency: WEEKLY
              timezone: Africa/Nairobi
              window_start: '02:00'
              window_end: '04:00'
              period_type: previous_week
      responses:
        '201':
          description: Schedule created (inactive).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HubSchedule'
        '400':
          description: Missing `connection_id` or `frequency`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Connection or pipeline not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Schedules]
      operationId: listSchedules
      summary: List schedules
      description: '**Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`, `REC_ADMIN`, `NATIONAL_ADMIN`.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/HubLimit'
        - name: connection_id
          in: query
          schema:
            type: string
            format: uuid
        - name: is_active
          in: query
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Page of schedules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HubSchedule'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/hub/schedules/{id}:
    patch:
      tags: [Schedules]
      operationId: updateSchedule
      summary: Update a schedule
      description: |
        Partially updates a schedule (`id`, `tenant_id`, `connection_id`,
        `created_at` ignored).

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubScheduleUpdate'
            example:
              frequency: MONTHLY
      responses:
        '200':
          $ref: '#/components/responses/ScheduleResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Schedules]
      operationId: deleteSchedule
      summary: Delete a schedule
      description: '**Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.'
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/schedules/{id}/activate:
    post:
      tags: [Schedules]
      operationId: activateSchedule
      summary: Activate a schedule
      description: '**Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.'
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/ScheduleResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/schedules/{id}/pause:
    post:
      tags: [Schedules]
      operationId: pauseSchedule
      summary: Pause a schedule
      description: '**Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.'
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/ScheduleResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════ AGREEMENTS ═══════════════════════════
  /api/v1/hub/agreements:
    post:
      tags: [Agreements]
      operationId: createAgreement
      summary: Create a data exchange agreement
      description: |
        Records a bilateral agreement for a connection: purpose, legal basis,
        domains, data scope, classification, frequency and SLA. A reference
        `HUB-YYYY-NNNNN` is generated. Status starts at `DRAFT`.

        Workflow: `DRAFT` → `propose` → `PROPOSED` → `accept` → `ACTIVE`
        (or `reject` → `REJECTED`); `ACTIVE` → `revoke` → `REVOKED`.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubAgreementCreate'
            example:
              connection_id: 3f1c2a9e-5b7d-4e8a-9c21-6d0f4b8a7e11
              title: Kenya KLHIS — animal health event reporting to ARIS
              purpose: Near-real-time reporting of notifiable animal disease events
              legal_basis: AU-IBAR / Kenya DVS memorandum of understanding (2026)
              partner_name: Directorate of Veterinary Services, Kenya
              domains: [animal-health]
              direction: INBOUND
              data_scope:
                entities: [health_events]
                diseases: [FMD, PPR, LSD, RVF]
              data_classification: RESTRICTED
              frequency: REALTIME
              timeliness_sla_hours: 48
              quality_min_score: 0.8
              valid_from: '2026-11-01'
              valid_until: '2028-10-31'
      responses:
        '201':
          description: Agreement created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HubAgreement'
        '400':
          description: Missing `connection_id`, `title`, `partner_name` or `direction`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Connection not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Agreements]
      operationId: listAgreements
      summary: List agreements
      description: '**Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`, `REC_ADMIN`, `NATIONAL_ADMIN`.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/HubLimit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/HubAgreementStatus'
        - name: connection_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Page of agreements.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HubAgreement'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/hub/agreements/{id}:
    get:
      tags: [Agreements]
      operationId: getAgreement
      summary: Get an agreement
      description: '**Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`, `REC_ADMIN`, `NATIONAL_ADMIN`.'
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/AgreementResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Agreements]
      operationId: updateAgreement
      summary: Update a draft agreement
      description: |
        Partially updates an agreement in `DRAFT` (`id`, `tenant_id`, `reference`,
        `created_by`, `created_at` ignored).

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubAgreementUpdate'
            example:
              timeliness_sla_hours: 24
      responses:
        '200':
          $ref: '#/components/responses/AgreementResult'
        '400':
          description: Agreement not in DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/agreements/{id}/propose:
    post:
      tags: [Agreements]
      operationId: proposeAgreement
      summary: Propose an agreement
      description: |
        `DRAFT` → `PROPOSED`.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/AgreementResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/agreements/{id}/accept:
    post:
      tags: [Agreements]
      operationId: acceptAgreement
      summary: Accept an agreement
      description: |
        `PROPOSED` or `UNDER_REVIEW` → `ACTIVE`.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          $ref: '#/components/responses/AgreementResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/agreements/{id}/reject:
    post:
      tags: [Agreements]
      operationId: rejectAgreement
      summary: Reject an agreement
      description: |
        `PROPOSED` or `UNDER_REVIEW` → `REJECTED`. The `reason` is written to the hub
        audit log (not stored on the agreement).

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
            example:
              reason: Legal basis not yet signed by the data owner.
      responses:
        '200':
          $ref: '#/components/responses/AgreementResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hub/agreements/{id}/revoke:
    post:
      tags: [Agreements]
      operationId: revokeAgreement
      summary: Revoke an agreement
      description: |
        `ACTIVE` or `ACCEPTED` → `REVOKED`. The `reason` is written to the hub audit
        log. Revoking does not suspend the connection; suspend it separately to stop
        the data flow.

        **Roles:** `SUPER_ADMIN`, `CONTINENTAL_ADMIN`, `INTEROP_MANAGER`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgreementResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
