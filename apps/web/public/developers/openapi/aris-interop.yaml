# ARIS Interoperability API, partner edition (public).
# Generated from docs/api/aris-interop.internal.openapi.yaml; edit that file, then regenerate.
openapi: 3.1.0
info:
  title: ARIS — Interoperability API
  version: 1.0.0
  summary: Exchange animal-resources data with the African Union ARIS platform.
  contact:
    name: AU-IBAR ARIS team
    url: https://au-aris.org
  license:
    name: Proprietary — AU-IBAR. Use subject to a data exchange agreement.
    url: https://au-aris.org
  description: |
    ## Overview

    **ARIS** (Animal Resources Information System) is the continental digital
    infrastructure of the African Union Inter-African Bureau for Animal Resources
    (AU-IBAR). It covers the eight ARIS domains: Animal Health, Livestock production,
    Economy & Trade, Fisheries & Aquaculture, Governance, Wildlife, Apiculture and
    Knowledge management, for the 55 AU Member States and 8 Regional Economic
    Communities (RECs).

    This reference describes the API that **partner systems** use to exchange data
    with ARIS: national information systems (e.g. DHIS2, national LIMS), regional
    bodies and international partners (AU-DOHP, WOAH, FAO). Data is produced and
    validated at country level; ARIS consolidates it at REC and continental level
    ("report once, use many").

    ## How an exchange works

    Each partner system is registered in ARIS as a **connection**. The ARIS team
    configures, for that connection, how your codes and fields map to ARIS
    (diseases, species, administrative units, units) and how the data is
    processed. You then only need the endpoints below.

    | You want to… | Use |
    |---|---|
    | Send records to ARIS from your system | `POST /api/v1/hub/ingest/push` (API key) |
    | Push events in real time | `POST /api/v1/hub/ingest/webhook/{connectionId}` (HMAC signature) |
    | Follow the processing of what you sent | `GET /api/v1/hub/ingest/transactions/{id}` (same API key) |
    | Look up ARIS codes for your mappings | `GET /api/v1/master-data/…` (service account) |
    | Receive data from ARIS | ARIS calls **your** endpoint — see *Receiving data from ARIS* |

    Every submission becomes a **transaction**. ARIS replies `202 Accepted` with a
    `transaction_id` as soon as the data is stored, then processes it in the
    background: code mapping, field mapping, schema and quality checks, and loading
    into the ARIS validation workflow. A transaction ends as `COMPLETED` (all records
    accepted), `PARTIAL` (some records rejected, with the reason per record),
    `FAILED`, `REJECTED` or `CANCELLED`. Connections configured for manual review
    first stop in `AWAITING_REVIEW` until an ARIS data manager approves them.

    ## Environments

    | Environment | Base URL | Purpose |
    |---|---|---|
    | Sandbox | `https://test.au-aris.org` | **Integration tests.** Separate database, accounts and keys. |
    | Production | `https://au-aris.org` | Live, official data. |

    Every partner starts on the sandbox. Production credentials are issued once the
    integration tests are validated and the data exchange agreement is in place.
    Credentials are specific to each environment.

    ## Credentials

    The ARIS team issues, for each partner system and each environment:

    1. **A connection API key** (or connection token), sent as `X-API-Key: <key>`
       (or `Authorization: Bearer <token>`). It is used to push data and to read the
       status of your own transactions.
    2. **A webhook secret**, if you push events by webhook. Each request carries an
       `X-Webhook-Signature` header: the HMAC-SHA256 of the raw body.
    3. **A read-only service account**, to look up ARIS reference data. Log in with
       `POST /api/v1/credential/auth/login` to get a 15-minute access token.

    Credentials are sent to your technical focal point through a separate secure
    channel. Keep them server-side and never share one service account between
    systems or with human users: a new login revokes the previous session of the
    same account.

    ## Receiving data from ARIS

    When you receive data from ARIS (e.g. validated events for AU-DOHP, WAHIS-ready
    packages for WOAH, FAOSTAT-anchored datasets for FAO), ARIS calls an endpoint
    **on your side**:

    * `POST` (or the method agreed) to the URL registered for your connection;
    * body in the format agreed for the exchange: JSON, WOAH WAHIS XML/JSON,
      EMPRES JSON or FAOSTAT CSV, with the matching `Content-Type`;
    * authenticated with the credential you give us: `Authorization: Bearer`,
      an API-key header of your choice, or HTTP Basic;
    * `User-Agent: ARIS-InteropHub/1.0`;
    * retried on `5xx` responses and timeouts. Reply `2xx` once the data is stored.

    If you cannot expose an endpoint, ARIS keeps the package and the ARIS team
    shares it with your focal point.

    ## Bulk files

    CSV, TSV and JSON files can also be loaded through the ARIS portal by your ARIS
    interoperability manager. They follow the same processing as API pushes.

    ## Limits

    | Limit | Value |
    |---|---|
    | Records per push | 10,000 |
    | JSON request body (push, webhook) | 50 MiB, larger payloads get `413` |
    | Page size (`limit`) on reference data | max 500 |
    | Login / refresh | 10 requests per minute per IP (`429` with `Retry-After`) |

    ## Conventions

    * Responses use the envelope `{ "data": …, "meta"?: { "total", "page", "limit" } }`.
    * Errors use `{ "statusCode", "message", "errors"?: [{ "field", "message" }] }`.
    * Ingestion resources use `snake_case` fields; authentication and reference-data
      resources use `camelCase`.
    * Timestamps are ISO 8601 UTC. Country codes are ISO 3166-1 alpha-2 (e.g. `KE`).

    ## Data classification and sovereignty

    ARIS classifies data as `PUBLIC`, `PARTNER`, `RESTRICTED` or `CONFIDENTIAL`.
    Individual outbreak records and unconfirmed events are `RESTRICTED`.
    Classification is inherited by derived products, and the classification agreed
    for an exchange is recorded in its data exchange agreement. Official WOAH
    notifications remain the sovereign responsibility of each Member State;
    analytical outputs carry provenance and disclaimers.

    ## Support

    Contact the ARIS team at AU-IBAR through your focal point, or via
    [au-aris.org](https://au-aris.org).
servers:
- url: https://test.au-aris.org
  description: Sandbox, for integration tests
- url: https://au-aris.org
  description: Production
security:
- bearerAuth: []
tags:
- name: Authentication
  description: Log in with your read-only service account to call the reference-data endpoints.
- name: Data ingestion
  description: Send data to ARIS by API push or signed webhook, and follow the result.
- name: Reference data
  description: ARIS codes for geography, species, diseases and units, used to map your own codes.
paths:
  /api/v1/credential/auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Log in and obtain tokens
      description: |
        Authenticates your service account and returns an access token (JWT
        RS256, 15 minutes) and a refresh token.

        * **Rate limited**: 10 requests per minute per client IP (`429` + `Retry-After`).
        * **MFA**: if TOTP is enabled on the account and `totpCode` is omitted, the
          response is `200` with `mfaRequired: true` and empty tokens; repeat the call
          with `totpCode`.
        * **Lockout**: repeated failures temporarily lock the account (`401`).
        * **Single session**: a new login revokes the previous session of the same
          account on the same device class. Use one dedicated service account per
          partner system.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: svc-klhis@ke.au-aris.org
              password: ••••••••••••
      responses:
        '200':
          description: Authenticated, or MFA code required.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/LoginResponse'
                - $ref: '#/components/schemas/MfaRequiredResponse'
              examples:
                success:
                  summary: Tokens issued
                  value:
                    data:
                      accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI…
                      refreshToken: ZDRmNmE3YjItOGMxZS00ZjNhLTkyYjAtMWU1YzZkN2U4ZjkwOjc…
                      expiresIn: 900
                      user:
                        id: d4f6a7b2-8c1e-4f3a-92b0-1e5c6d7e8f90
                        email: svc-klhis@ke.au-aris.org
                        firstName: KLHIS
                        lastName: Integration
                        role: ANALYST
                        roles:
                        - ANALYST
                        tenantId: 1e7b4c2a-9d3f-4a5b-8c6d-7e8f9a0b1c2d
                        tenantLevel: MEMBER_STATE
                        domains: []
                        mustChangePassword: false
                      permissions: {}
                mfa:
                  summary: MFA required
                  value:
                    data:
                      mfaRequired: true
                      accessToken: ''
                      refreshToken: ''
                      expiresIn: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong credentials, invalid TOTP code, inactive or locked account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                message: Adresse e-mail ou mot de passe incorrect
        '403':
          description: Temporary account expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/credential/auth/refresh:
    post:
      tags:
      - Authentication
      operationId: refreshToken
      summary: Renew the access token
      description: |
        Exchanges a refresh token for a new access token **and a new refresh token**.
        Refresh tokens are single-use (rotated): always store the new one. A refresh
        token is rejected (`401`, code `SESSION_REVOKED_NEW_DEVICE`) if the account
        has logged in again elsewhere. Rate limited to 10 requests/minute per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: ZDRmNmE3YjItOGMxZS00ZjNhLTkyYjAtMWU1YzZkN2U4ZjkwOjc…
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                data:
                  accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9…
                  refreshToken: ZDRmNmE3YjItOGMxZS00ZjNhLTkyYjAtMWU1YzZkN2U4ZjkwOjg…
                  expiresIn: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid, expired or revoked session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                message: Votre session a été fermée car une nouvelle connexion a été ouverte depuis un
                  autre appareil.
                code: SESSION_REVOKED_NEW_DEVICE
        '403':
          description: Temporary account expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/credential/auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Log out
      description: Blacklists the current access token and deletes all refresh tokens of the account.
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
              example:
                data:
                  message: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/hub/ingest/push:
    post:
      tags:
      - Data ingestion
      operationId: ingestPush
      summary: Push records (API push)
      description: |
        Sends a batch of records from a partner system. The connection is identified
        by its credential:

        * `X-API-Key: <key>`, **or**
        * `Authorization: Bearer <token>`. This is a **connection token, not a user JWT**.

        If both headers are sent, `X-API-Key` takes precedence. The connection must be active.

        The hub selects the connection's ACTIVE INBOUND pipeline for `domain` (or any
        active inbound pipeline of the connection if `domain` is omitted), stores the
        records in a new transaction (`QUEUED`) and returns **`202 Accepted`**
        immediately. Processing (mapping, validation, optional manual review,
        loading) continues in the background.

        **Body formats** — records are taken from, in order: `records` (array),
        `payload` (array), or `payload` (single object = one record). Each record is a
        flat or nested JSON object using your own field names and codes; the
        connection's mappings translate them.

        **Limits** — 1 to 10,000 records, and a request body of at most 50 MiB. Split larger batches.

        **Tracking** — keep the returned `transaction_id` and poll
        `GET /api/v1/hub/ingest/transactions/{id}` with the **same** `X-API-Key` /
        connection token until the status is final (`AWAITING_REVIEW`, `COMPLETED`,
        `PARTIAL`, `FAILED`, `REJECTED` or `CANCELLED`). A polling interval of
        10–30 seconds is recommended.

        ```bash
        curl -X POST https://test.au-aris.org/api/v1/hub/ingest/push \
          -H "X-API-Key: $ARIS_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{
                "domain": "animal-health",
                "entity_type": "health_events",
                "records": [{
                  "event_id": "KLHIS-2026-000184",
                  "disease_code": "FMD-KE",
                  "species_code": "CTL",
                  "admin2_code": "KE-01",
                  "report_date": "2026-10-28",
                  "cases": 14, "deaths": 2, "susceptible": 320
                }]
              }'
        ```
      security:
      - apiKeyAuth: []
      - connectionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestPushRequest'
            examples:
              records:
                summary: Batch of outbreak reports (Kenya, FMD in cattle)
                value:
                  domain: animal-health
                  entity_type: health_events
                  records:
                  - event_id: KLHIS-2026-000184
                    disease_code: FMD-KE
                    species_code: CTL
                    admin2_code: KE-01
                    report_date: '2026-10-28'
                    onset_date: '2026-10-24'
                    cases: 14
                    deaths: 2
                    susceptible: 320
                    latitude: -4.05
                    longitude: 39.67
                  - event_id: KLHIS-2026-000185
                    disease_code: FMD-KE
                    species_code: CTL
                    admin2_code: KE-02
                    report_date: '2026-10-29'
                    cases: 6
                    deaths: 0
                    susceptible: 150
              singlePayload:
                summary: Single record in `payload`
                value:
                  domain: animal-health
                  payload:
                    event_id: KLHIS-2026-000186
                    disease_code: FMD-KE
                    species_code: CTL
                    admin2_code: KE-03
                    report_date: '2026-10-30'
                    cases: 3
      responses:
        '202':
          description: Records stored; processing queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAccepted'
              examples:
                automatic:
                  value:
                    data:
                      transaction_id: 6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80
                      status: QUEUED
                      records_received: 2
                      message: Data queued for processing
                manual:
                  value:
                    data:
                      transaction_id: 6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80
                      status: QUEUED
                      records_received: 2
                      message: Data queued; it will await manual review before loading
        '400':
          description: Missing body content, empty batch, more than 10,000 records or invalid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    statusCode: 400
                    message: records[] or payload is required
                empty:
                  value:
                    statusCode: 400
                    message: records[] must contain at least one record
                tooMany:
                  value:
                    statusCode: 400
                    message: Maximum 10,000 records per push. Use file upload for larger batches.
        '401':
          description: No credential, or it matches no active inbound connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                message: Invalid or missing API key / bearer token. Could not identify connection.
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The connection has no ACTIVE INBOUND pipeline (for the given domain).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 422
                message: No active inbound pipeline found for connection "Kenya KLHIS" and domain "animal-health"
  /api/v1/hub/ingest/transactions/{id}:
    get:
      tags:
      - Data ingestion
      operationId: getIngestTransactionStatus
      summary: Get the status of a pushed transaction
      description: |
        Returns the processing status and per-record results of a transaction, for
        the partner system that sent it. Authenticate with the **same credential as
        the push** (`X-API-Key` or connection `Authorization: Bearer <token>`); only
        transactions of that connection are visible (others return `404`). It works for transactions created by push, webhook or file upload on that connection.

        Per-record results (`records`) are written when processing finishes; while
        the transaction is still running (or waiting in `AWAITING_REVIEW`) the array
        is empty. `submission_id` is the ID of the ARIS data-collection submission
        created for an accepted inbound record.

        ```bash
        curl https://test.au-aris.org/api/v1/hub/ingest/transactions/6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80 \
          -H "X-API-Key: $ARIS_API_KEY"
        ```
      security:
      - apiKeyAuth: []
      - connectionToken: []
      parameters:
      - name: id
        in: path
        required: true
        description: The `transaction_id` returned by the ingest call.
        schema:
          type: string
          format: uuid
        example: 6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80
      responses:
        '200':
          description: Transaction status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestTransactionStatus'
              examples:
                partial:
                  summary: Finished, one record rejected
                  value:
                    data:
                      transaction_id: 6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80
                      status: PARTIAL
                      records_total: 2
                      records_accepted: 1
                      records_rejected: 1
                      error_message: 1 record(s) rejected
                      started_at: '2026-11-06T08:15:02.114Z'
                      completed_at: '2026-11-06T08:15:04.870Z'
                      records:
                      - record_index: 0
                        status: ACCEPTED
                        error_message: null
                        submission_id: 7c1e3a5b-9d2f-4b6e-8a0c-1d3e5f7a9b2c
                      - record_index: 1
                        status: REJECTED
                        error_message: 'Collecte 400: admin2_code KE-99 is not a valid administrative
                          unit'
                        submission_id: null
                review:
                  summary: Waiting for manual review
                  value:
                    data:
                      transaction_id: 6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80
                      status: AWAITING_REVIEW
                      records_total: 2
                      records_accepted: 0
                      records_rejected: 0
                      error_message: null
                      started_at: '2026-11-06T08:15:02.114Z'
                      completed_at: null
                      records: []
        '400':
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 400
                message: Invalid transaction id
        '401':
          description: No credential, or it matches no active inbound connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 401
                message: Invalid or missing API key / bearer token. Could not identify connection.
        '404':
          description: No transaction with this id for the authenticated connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 404
                message: Transaction not found
  /api/v1/hub/ingest/webhook/{connectionId}:
    post:
      tags:
      - Data ingestion
      operationId: ingestWebhook
      summary: Receive a signed webhook
      description: |
        Event-driven delivery from a partner system to an ACTIVE INBOUND connection.
        The body is either `{ "records": [ … ] }` (several records) or any other JSON
        object, which is treated as **one** record. The first ACTIVE INBOUND pipeline
        of the connection processes it (the `domain` is not selectable — use one
        inbound pipeline per webhook connection). Returns **`202 Accepted`**.

        **Signature (mandatory).** Compute HMAC-SHA256 over the **exact raw bytes** of
        the request body with the connection's webhook secret, and send it in
        `X-Webhook-Signature` as lowercase/uppercase hex (optionally prefixed with
        `sha256=`) or as base64. Sign the exact string you send — re-serialising the
        JSON after signing will break the signature. `Content-Type` must be
        `application/json`. Requests are rejected with `401` if the connection has no
        webhook secret configured, the header is missing, or the signature does not
        match. There is no timestamp/replay protection: include your own event ID in
        the payload so duplicates can be detected.

        **Node.js**
        ```js
        const crypto = require('node:crypto');

        const body = JSON.stringify({ records: [{ event_id: 'KLHIS-2026-000184',
          disease_code: 'FMD-KE', species_code: 'CTL', admin2_code: 'KE-01', cases: 14 }] });
        const signature = crypto.createHmac('sha256', process.env.ARIS_WEBHOOK_SECRET)
          .update(body, 'utf8').digest('hex');

        await fetch(`https://test.au-aris.org/api/v1/hub/ingest/webhook/${connectionId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Webhook-Signature': `sha256=${signature}` },
          body,                       // send exactly the bytes that were signed
        });
        ```

        **Python**
        ```python
        import hashlib, hmac, json, os, requests

        payload = {"records": [{"event_id": "KLHIS-2026-000184", "disease_code": "FMD-KE",
                                "species_code": "CTL", "admin2_code": "KE-01", "cases": 14}]}
        body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
        signature = hmac.new(os.environ["ARIS_WEBHOOK_SECRET"].encode("utf-8"),
                             body, hashlib.sha256).hexdigest()

        requests.post(
            f"https://test.au-aris.org/api/v1/hub/ingest/webhook/{connection_id}",
            data=body,  # raw bytes, not json=
            headers={"Content-Type": "application/json",
                     "X-Webhook-Signature": "sha256=" + signature},
            timeout=30,
        )
        ```
      security:
      - webhookSignature: []
      parameters:
      - name: connectionId
        in: path
        required: true
        description: ID of the inbound connection (provided by ARIS).
        schema:
          type: string
          format: uuid
        example: 3f1c2a9e-5b7d-4e8a-9c21-6d0f4b8a7e11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
            examples:
              batch:
                value:
                  records:
                  - event_id: KLHIS-2026-000184
                    disease_code: FMD-KE
                    species_code: CTL
                    admin2_code: KE-01
                    report_date: '2026-10-28'
                    cases: 14
                    deaths: 2
              single:
                value:
                  event_id: KLHIS-2026-000187
                  disease_code: FMD-KE
                  species_code: CTL
                  admin2_code: KE-04
                  report_date: '2026-11-02'
                  cases: 9
      responses:
        '202':
          description: Payload accepted and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAccepted'
              example:
                data:
                  transaction_id: 9e2b7c41-3d5f-4a68-b0c1-2d3e4f5a6b7c
                  status: QUEUED
                  message: Webhook payload received
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Secret not configured, signature header missing, or invalid signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    statusCode: 401
                    message: Missing webhook signature header (x-webhook-signature)
                invalid:
                  value:
                    statusCode: 401
                    message: Invalid webhook signature
                noSecret:
                  value:
                    statusCode: 401
                    message: Webhook secret not configured for this connection
        '404':
          description: Connection does not exist, is not ACTIVE, or is not INBOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 404
                message: Connection not found or inactive
        '413':
