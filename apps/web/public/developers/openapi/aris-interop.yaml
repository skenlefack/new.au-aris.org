components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        User access token (JWT RS256, 15 minutes) from
        `POST /api/v1/credential/auth/login`. Send as `Authorization: Bearer <token>`.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Static API key of an ACTIVE INBOUND connection (issued by the ARIS team). Accepted only by `POST /api/v1/hub/ingest/push`.
    connectionToken:
      type: http
      scheme: bearer
      description: |
        Static token of an ACTIVE INBOUND connection (issued by the ARIS team), sent as
        `Authorization: Bearer <token>`. Alternative to `X-API-Key` for
        `POST /api/v1/hub/ingest/push` only. This is not a user JWT.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: |
        HMAC-SHA256 of the raw request body, keyed with the webhook secret of your connection. Hex (optionally prefixed `sha256=`) or
        base64.
  parameters:
    Page:
      name: page
      in: query
      description: Page number (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
    RefLimit:
      name: limit
      in: query
      description: Page size (max 500).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 20
    Sort:
      name: sort
      in: query
      description: Field to sort by (camelCase field name).
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 6a9d1f3e-2b4c-4d8e-a1f2-3b4c5d6e7f80
  responses:
    BadRequest:
      description: Invalid request (missing or invalid fields, invalid JSON, or invalid state transition).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 400
            message: name, system_type, direction, and domains[] are required
    Unauthorized:
      description: Missing, malformed, invalid or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 401
            message: Invalid or expired token
    NotFound:
      description: Resource not found in the caller's tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 404
            message: Transaction not found
    PayloadTooLarge:
      description: Request body larger than 50 MiB (JSON) or file larger than 100 MB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 413
            message: Request body is too large
    TooManyRequests:
      description: Rate limit exceeded. Retry after the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 429
            message: Too many requests, please try again later
    GeoEntityResult:
      description: Geographic entity.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/GeoEntity'
  schemas:
    Error:
      type: object
      required:
      - statusCode
      - message
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
        code:
          type: string
          description: Machine-readable code (credential service only), e.g. `SESSION_EXPIRED`, `SESSION_REVOKED_NEW_DEVICE`.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    PaginationMeta:
      type: object
      required:
      - total
      - page
      - limit
      properties:
        total:
          type: integer
          example: 57
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        pages:
          type: integer
          description: Total number of pages (hub endpoints only).
          example: 3
    JsonObject:
      type: object
      additionalProperties: true
    Record:
      type: object
      additionalProperties: true
      description: One data record using the partner's own field names and codes.
      example:
        event_id: KLHIS-2026-000184
        disease_code: FMD-KE
        species_code: CTL
        admin2_code: KE-01
        report_date: '2026-10-28'
        cases: 14
        deaths: 2
    HubTransactionStatus:
      type: string
      enum:
      - RECEIVED
      - QUEUED
      - MAPPING
      - TRANSFORMING
      - VALIDATING
      - AWAITING_REVIEW
      - APPROVED
      - REJECTED
      - LOADING
      - COMPLETED
      - PARTIAL
      - FAILED
      - RETRY
      - CANCELLED
    HubRecordStatus:
      type: string
      enum:
      - ACCEPTED
      - REJECTED
      - WARNING
    UserRole:
      type: string
      enum:
      - SUPER_ADMIN
      - CONTINENTAL_ADMIN
      - REC_ADMIN
      - NATIONAL_ADMIN
      - DATA_STEWARD
      - WAHIS_FOCAL_POINT
      - ANALYST
      - FIELD_AGENT
      - DECISION_MAKER
      - KNOWLEDGE_MANAGER
      - INTEROP_MANAGER
    TenantLevel:
      type: string
      enum:
      - CONTINENTAL
      - REC
      - MEMBER_STATE
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          format: password
        totpCode:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit TOTP code, required when MFA is enabled on the account.
    RefreshRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        tenantId:
          type: string
          format: uuid
        tenantLevel:
          $ref: '#/components/schemas/TenantLevel'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/JsonObject'
        mustChangePassword:
          type: boolean
    LoginResponse:
      type: object
      properties:
        data:
          type: object
          required:
          - accessToken
          - refreshToken
          - expiresIn
          properties:
            accessToken:
              type: string
              description: JWT RS256 access token.
            refreshToken:
              type: string
              description: Opaque single-use refresh token.
            expiresIn:
              type: integer
              description: Access-token lifetime in seconds.
              example: 900
            user:
              $ref: '#/components/schemas/AuthUser'
            permissions:
              $ref: '#/components/schemas/JsonObject'
    MfaRequiredResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            mfaRequired:
              type: boolean
              const: true
            accessToken:
              type: string
              const: ''
            refreshToken:
              type: string
              const: ''
            expiresIn:
              type: integer
              const: 0
    TokenResponse:
      type: object
      properties:
        data:
          type: object
          required:
          - accessToken
          - refreshToken
          - expiresIn
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
              example: 900
    IngestPushRequest:
      type: object
      description: Provide `records` or `payload`.
      properties:
        domain:
          type: string
          description: ARIS domain; selects the inbound pipeline. If omitted, any active inbound pipeline
            of the connection is used.
          example: animal-health
        entity_type:
          type: string
          description: Overrides the pipeline's entity type on the transaction.
          example: health_events
        records:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: '#/components/schemas/Record'
        payload:
          description: An array of records, or a single record object.
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/Record'
          - $ref: '#/components/schemas/Record'
    IngestAccepted:
      type: object
      properties:
        data:
          type: object
          required:
          - transaction_id
          - status
          - records_received
          - message
          properties:
            transaction_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/HubTransactionStatus'
            records_received:
              type: integer
            message:
              type: string
    WebhookRequest:
      description: '`{ "records": [...] }` for several records; any other object is one record.'
      anyOf:
      - type: object
        required:
        - records
        properties:
          records:
            type: array
            items:
              $ref: '#/components/schemas/Record'
      - $ref: '#/components/schemas/Record'
    WebhookAccepted:
      type: object
      properties:
        data:
          type: object
          properties:
            transaction_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/HubTransactionStatus'
            message:
              type: string
    IngestTransactionStatus:
      type: object
      properties:
        data:
          type: object
          required:
          - transaction_id
          - status
          - records_total
          - records_accepted
          - records_rejected
          - records
          properties:
            transaction_id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/HubTransactionStatus'
            records_total:
              type: integer
            records_accepted:
              type: integer
            records_rejected:
              type: integer
            error_message:
              type:
              - string
              - 'null'
            started_at:
              type:
              - string
              - 'null'
              format: date-time
            completed_at:
              type:
              - string
              - 'null'
              format: date-time
            records:
              type: array
              description: Per-record results, ordered by `record_index` (empty until processing finishes).
              items:
                type: object
                properties:
                  record_index:
                    type: integer
                    description: 0-based position in the pushed batch.
                  status:
                    $ref: '#/components/schemas/HubRecordStatus'
                  error_message:
                    type:
                    - string
                    - 'null'
                  submission_id:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: ARIS data-collection submission created for the record (accepted inbound
                      records).
    LocalizedName:
      type: object
      properties:
        en:
          type: string
        fr:
          type: string
        pt:
          type: string
        ar:
          type: string
    GeoLevel:
      type: string
      enum:
      - COUNTRY
      - ADMIN1
      - ADMIN2
      - ADMIN3
      - ADMIN4
      - ADMIN5
      - SPECIAL_ZONE
    GeoEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: KE-01
        name:
          $ref: '#/components/schemas/LocalizedName'
        nameEn:
          type: string
        nameFr:
          type: string
