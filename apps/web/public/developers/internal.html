<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ARIS Developers — Full API reference</title>
  <link rel="icon" href="/au-logo.png" />
  <style>
    :root {
      --aris-green: #1A5632;
      --aris-gold: #B4A269;
      --aris-red: #9F2241;
      --scalar-custom-header-height: 56px;
    }
    html, body { margin: 0; padding: 0; background: #fff; color: #1f1f1f;
      font: 400 15px/1.5 Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
    .aris-bar {
      position: sticky; top: 0; z-index: 1000; height: 56px; box-sizing: border-box;
      display: flex; align-items: center; gap: 14px; padding: 0 20px;
      background: var(--aris-green); color: #fff; font-weight: 500; font-size: 14px;
      border-bottom: 3px solid var(--aris-gold);
    }
    .aris-bar img { height: 32px; width: auto; }
    .aris-bar .title { font-weight: 700; font-size: 16px; white-space: nowrap; }
    .aris-bar .sub { opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .aris-bar .spacer { flex: 1; }
    .aris-bar .badge {
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap;
      background: var(--aris-red); border: 1px solid var(--aris-red);
    }
    .aris-bar a, .aris-bar button {
      color: #fff; text-decoration: none; padding: 6px 10px; border-radius: 6px; white-space: nowrap;
      border: 1px solid rgba(255,255,255,.35); background: transparent; font: inherit; cursor: pointer;
    }
    .aris-bar a:hover, .aris-bar button:hover { background: rgba(255,255,255,.12); }
    .aris-bar [hidden] { display: none; }
    @media (max-width: 760px) { .aris-bar .sub, .aris-bar .secondary { display: none; } }
    .notice {
      max-width: 560px; margin: 80px auto; padding: 28px 24px; box-sizing: border-box;
      border: 1px solid #e3e3e3; border-top: 4px solid var(--aris-green); border-radius: 10px; text-align: center;
    }
    .notice h1 { font-size: 20px; margin: 0 0 10px; }
    .notice p { margin: 0 0 18px; color: #4a4a4a; }
    .notice a { display: inline-block; padding: 9px 16px; border-radius: 6px; background: var(--aris-green);
      color: #fff; text-decoration: none; font-weight: 600; margin: 0 4px; }
    .notice a.ghost { background: transparent; color: var(--aris-green); border: 1px solid var(--aris-green); }
    @media (max-width: 600px) { .notice { margin: 40px 16px; } }
  </style>
</head>
<body>
  <header class="aris-bar">
    <img src="/au-logo.png" alt="African Union" />
    <span class="title">ARIS Developers</span>
    <span class="sub">Full Interoperability API · internal reference</span>
    <span class="spacer"></span>
    <span class="badge">Restricted</span>
    <button id="download" class="secondary" type="button" hidden>OpenAPI 3.1 (YAML)</button>
    <a class="secondary" href="/developers">Partner reference</a>
    <a href="/home">ARIS</a>
  </header>

  <div id="notice" class="notice" hidden></div>
  <div id="app"></div>

  <script src="/developers/scalar/standalone.js"></script>
  <script>
    (function () {
      function token() {
        try {
          var raw = window.localStorage.getItem('aris-auth');
          var parsed = raw ? JSON.parse(raw) : null;
          return (parsed && parsed.state && parsed.state.accessToken) || null;
        } catch (e) { return null; }
      }

      function notice(title, text, showSignIn) {
        var box = document.getElementById('notice');
        box.innerHTML = '';
        var h = document.createElement('h1'); h.textContent = title;
        var p = document.createElement('p'); p.textContent = text;
        box.appendChild(h); box.appendChild(p);
        if (showSignIn) {
          var a = document.createElement('a'); a.href = '/'; a.textContent = 'Sign in to ARIS';
          box.appendChild(a);
        }
        var b = document.createElement('a'); b.href = '/developers'; b.className = 'ghost';
        b.textContent = 'Partner API reference';
        box.appendChild(b);
        box.hidden = false;
      }

      var t = token();
      if (!t) {
        notice('Sign in required', 'This reference is restricted to ARIS Super Administrators and Continental Administrators.', true);
        return;
      }

      fetch('/api/developers/internal-spec', { headers: { Authorization: 'Bearer ' + t }, cache: 'no-store' })
        .then(function (res) {
          if (res.ok) return res.text();
          return res.json().catch(function () { return {}; }).then(function (body) {
            var msg = body.message || 'Access denied.';
            if (res.status === 401) notice('Sign in required', msg, true);
            else if (res.status === 403) notice('Access restricted', msg, false);
            else notice('Unavailable', msg, false);
            return null;
          });
        })
        .then(function (spec) {
          if (!spec) return;

          var dl = document.getElementById('download');
          dl.hidden = false;
          dl.addEventListener('click', function () {
            var url = URL.createObjectURL(new Blob([spec], { type: 'application/yaml' }));
            var a = document.createElement('a');
            a.href = url; a.download = 'aris-interop.internal.yaml';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          });

          var host = window.location.host;
          var isProd = /^(www\.)?au-aris\.org$/.test(host);
          var isStaging = /^test\.au-aris\.org$/.test(host);
          var prod = { url: 'https://au-aris.org', description: 'Production' };
          var stg = { url: 'https://test.au-aris.org', description: 'Staging' };
          var servers = isProd ? [prod, stg] : isStaging ? [stg, prod]
            : [{ url: window.location.origin, description: 'This server' }, stg, prod];

          Scalar.createApiReference('#app', {
            content: spec,
            servers: servers,
            theme: 'default',
            layout: 'modern',
            defaultHttpClient: { targetKey: 'shell', clientKey: 'curl' },
            hideDownloadButton: true,
            agent: { disabled: true },
            showDeveloperTools: 'never',
            telemetry: false,
            persistAuth: false,
            metaData: { title: 'ARIS Developers — Full API reference' },
            favicon: '/au-logo.png',
            customCss: [
              '.light-mode, .dark-mode {',
              '  --scalar-color-accent: #1A5632;',
              '  --scalar-font: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;',
              '}',
              '.dark-mode { --scalar-color-accent: #6FBF8A; }',
              '.light-mode .t-doc__sidebar { --scalar-sidebar-item-active-background: #E6F0E8; }',
            ].join('\n'),
          });
        })
        .catch(function () {
          notice('Unavailable', 'Could not load the API reference. Try again later.', false);
        });
    })();
  </script>
</body>
</html>
